<style>
:root{--background:#FAF7F2;--surface:#FFFFFF;--surface-soft:#F4EFE8;--text:#27211F;--muted:#6F6761;--border:#E4D8CC;--primary:#8A4F3D;--primary-dark:#63372D;--secondary:#C49A5A;--accent-soft:#F2DDD3;--urgent:#B42318;--urgent-soft:#FDECEC}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin-top:0}h1{font-size:34px;line-height:1.08}h2{font-size:23px}h3{font-size:18px}.wrap{max-width:1180px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.brand{font-size:23px;font-weight:850}.tag,.muted{color:var(--muted)}.hero{min-height:100vh;display:grid;place-items:center;padding:22px}.hero-card,.card,.plan{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 18px 45px rgba(39,33,31,.07)}.hero-card{width:min(660px,100%);padding:34px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px}.plan{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:850}.choices{display:grid;gap:12px;margin-top:18px}.choice,.btn{min-height:48px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:12px 14px;text-align:left;font-weight:750}.choice:hover,.choice.active{border-color:var(--primary);background:var(--accent-soft)}.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.dark{background:var(--primary-dark);border-color:var(--primary-dark);color:white}.btn.warn{background:var(--urgent);border-color:var(--urgent);color:white}.btn.ghost{background:transparent}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.progress{height:9px;background:var(--surface-soft);border-radius:999px;overflow:hidden;margin-bottom:16px}.bar{height:100%;background:var(--primary)}.section{border-top:1px solid var(--border);margin-top:18px;padding-top:18px}.pill{display:inline-flex;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface-soft);font-size:13px;font-weight:750}.lane,.script,.resource,.log,.note{border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:14px}.lane{border-left:5px solid var(--primary)}.note{background:var(--accent-soft)}.urgent{background:var(--urgent-soft);border-color:#f0b8b3}.field{display:grid;gap:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;background:white}.field textarea{min-height:96px}.small{font-size:13px}.list{margin:8px 0 0 18px;padding:0}.list li{margin:6px 0}.modal{position:fixed;inset:0;background:rgba(39,33,31,.45);display:grid;place-items:center;padding:18px;z-index:10}.modal-card{width:min(780px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px}.tele-line{min-height:220px;background:var(--primary-dark);color:white;border-radius:10px;padding:30px;font-size:31px;line-height:1.25;display:flex;align-items:center}.hidden{display:none!important}@media(max-width:920px){.layout{grid-template-columns:1fr}.plan{position:static;max-height:none}.two{grid-template-columns:1fr}.top{flex-direction:column}}@media print{.no-print,.modal,.hero{display:none!important}.layout{display:block}.wrap{max-width:none}.plan,.card{box-shadow:none;border:0}.plan{position:static;max-height:none}}

<body><div id="app"></div><script>
const KEY='decodedHousingSelfHelpMvp';
const questions=[
{id:'safeTonight',q:'Are you safe tonight?',type:'single',options:['Yes, I am safe tonight','No, I need help tonight',"I'm not sure"]},
{id:'sleepTonight',q:'Do you have somewhere safe to sleep tonight?',type:'single',options:['Yes','No','Maybe, but it is not stable']},
{id:'safeContact',q:'Is it safe for housing programs to call or text you?',type:'single',options:['Yes','No','Only inside this plan']},
{id:'status',q:'What is your current housing situation?',type:'single',options:['sleeping outside','sleeping in a vehicle','emergency shelter','doubled up / couch surfing','motel / hotel','housed but unsafe','housed but unaffordable','received a notice','eviction case filed','voucher holder searching for a unit','long-term affordable housing seeker']},
{id:'deadlineType',q:'Is there a deadline?',type:'single',options:['must leave by date','notice date','court date','voucher expiration','shelter exit date','utility shutoff','application or waitlist deadline','no known deadline']},
{id:'deadlineDate',q:'What date is the deadline?',hint:'Leave blank if unknown.',type:'date'},
{id:'household',q:'Who is in your household?',type:'multi',options:['just me','partner/spouse','children','pregnant person','senior/elder','disability/medical need','pets','service animal','veteran','youth/young adult','reentry from jail/prison','fleeing violence or stalking']},
{id:'barriers',q:'What barriers could block housing right now?',type:'multi',options:['missing ID','missing birth certificate','no Social Security card','no income proof','no phone','no mailing address','no transportation','no internet/device','prior eviction','rental debt','credit issues','criminal history','no rental history','disability accommodation needed','language access needed','childcare','move-in funds','furniture','household supplies','utilities setup',"renter's insurance",'food','phone/internet']},
{id:'strengths',q:'What strengths can we use?',type:'multi',options:['income or benefits','employment','voucher','past rental history','landlord reference','support person','case manager','vehicle/transportation','documents ready','veteran status','school connection','willing to consider more than one area']},
{id:'area',q:'What city or area are you trying to stay near?',type:'text',placeholder:'Example: Bellevue, Redmond, Seattle, South King County'}
];
const categories=['Crisis Lines','Shelters','Day Centers','Coordinated Entry','Legal Aid','Rent Assistance','ARCH / Affordable Housing','Voucher Support','Basic Needs','Utilities','Food','Furniture','Transportation','Disability / Accommodation','DV / Safety','Reentry','Youth','Veterans'];
// The sampleResources array is the placeholder for the future Housing_Decoded workbook import. Do not expose the full database as a directory. Resources should only be matched into My Housing Plan.
const sampleResources=[
{id:'211',name:'211',category:'Crisis Lines',organization:'Washington 211',city:'King County',county:'King',phone:'211',email:'',website:'https://wa211.org',address:'Phone-based',whatItHelpsWith:'Emergency shelter referrals, day center leads, safe parking questions, basic needs referrals.',whoItServes:'People seeking same-day housing and basic needs information.',eligibilityNotes:'Call to confirm current options.',referralRequired:false,walkInAvailable:false,voucherFriendly:null,waitlistStatus:'changes daily',applicationMethod:'phone',documentsNeeded:['household size','location','children ages','accessibility needs'],whatToAskFor:'Ask what is open tonight, what opens tomorrow morning, and what fallback is safest.',scriptType:'shelter211',relatedPathways:['Shelter Survival Plan','Basic Needs Stabilization'],relatedBarriers:['food','no phone','no transportation'],urgencyLevel:'Immediate',lastChecked:'Sample only',sourceLabel:'Sample resource card',verificationStatus:'Needs verification',staleWarning:'Sample data may be outdated.',callToConfirm:true,notes:'A shelter list does not mean a bed is open tonight.'},
{id:'rap',name:'Coordinated Entry / Regional Access Point',category:'Coordinated Entry',organization:'King County Homeless Response System',city:'King County',county:'King',phone:'Call 211 for current RAP connection',email:'',website:'',address:'Varies',whatItHelpsWith:'Assessment for homelessness response programs and possible referrals.',whoItServes:'People experiencing homelessness or unstable shelter.',eligibilityNotes:'Assessment does not guarantee housing.',referralRequired:false,walkInAvailable:null,voucherFriendly:null,waitlistStatus:'varies',applicationMethod:'phone or appointment',documentsNeeded:['household names','current sleeping situation','income if any','disability or medical information if relevant'],whatToAskFor:'Ask how to schedule, what to bring, and how to check status.',scriptType:'ce',relatedPathways:['Shelter Survival Plan','Coordinated Entry Decoder'],relatedBarriers:['missing ID','no phone','no transportation'],urgencyLevel:'High',lastChecked:'Sample only',sourceLabel:'Sample resource card',verificationStatus:'Needs verification',staleWarning:'Call to confirm current access point.',callToConfirm:true,notes:'Keep a parallel plan active.'},
{id:'legal',name:'Legal aid tenant support',category:'Legal Aid',organization:'Sample King County legal aid referral',city:'King County',county:'King',phone:'Call 211 or local tenant hotline to confirm',email:'',website:'',address:'Varies',whatItHelpsWith:'Plain-language help when there is a notice, eviction case, denial, or deadline.',whoItServes:'Tenants and households with housing legal issues.',eligibilityNotes:'This app is not legal advice.',referralRequired:null,walkInAvailable:null,voucherFriendly:null,waitlistStatus:'varies',applicationMethod:'phone intake',documentsNeeded:['notice','lease','court papers','rent ledger','communications'],whatToAskFor:'Ask what deadline applies and what documents to send.',scriptType:'legalNotice',relatedPathways:['Notice Triage'],relatedBarriers:['prior eviction','rental debt','credit issues'],urgencyLevel:'Immediate',lastChecked:'Sample only',sourceLabel:'Sample resource card',verificationStatus:'Needs verification',staleWarning:'Call to confirm intake hours.',callToConfirm:true,notes:'For court or notice deadlines, contact legal aid quickly.'},
{id:'arch',name:'ARCH property contact approach',category:'ARCH / Affordable Housing',organization:'ARCH-participating property managers',city:'East King County',county:'King',phone:'Property-specific',email:'Property-specific',website:'Property-specific',address:'Property-specific',whatItHelpsWith:'Affordable housing applications and waitlist checks by property.',whoItServes:'East King County affordable housing seekers.',eligibilityNotes:'ARCH is not a central waitlist.',referralRequired:false,walkInAvailable:null,voucherFriendly:null,waitlistStatus:'property-specific',applicationMethod:'contact each property directly',documentsNeeded:['income estimate','household size','voucher information if any','ID if available'],whatToAskFor:'Ask whether applications are open, whether vouchers are accepted, and when to check back.',scriptType:'arch',relatedPathways:['ARCH / East King County Affordable Housing'],relatedBarriers:['no internet/device','no transportation','language access needed'],urgencyLevel:'Planning',lastChecked:'Sample only',sourceLabel:'Sample resource card',verificationStatus:'Needs verification',staleWarning:'Call each property to confirm.',callToConfirm:true,notes:'Do not wait for a central ARCH list.'},
{id:'utility',name:'Utility assistance provider',category:'Utilities',organization:'Sample utility assistance pathway',city:'King County',county:'King',phone:'Call provider or 211 to confirm',email:'',website:'',address:'Varies',whatItHelpsWith:'Utility shutoff prevention or startup cost support.',whoItServes:'Households with utility bills, shutoff risk, or move-in utility needs.',eligibilityNotes:'Funding may open and close.',referralRequired:null,walkInAvailable:null,voucherFriendly:null,waitlistStatus:'funding varies',applicationMethod:'phone or online',documentsNeeded:['utility account','shutoff notice','income proof','address'],whatToAskFor:'Ask whether help can stop shutoff or support startup costs.',scriptType:'utility',relatedPathways:['Basic Needs Stabilization','Stay-Housed Starter'],relatedBarriers:['utilities setup','food','move-in funds'],urgencyLevel:'High',lastChecked:'Sample only',sourceLabel:'Sample resource card',verificationStatus:'Needs verification',staleWarning:'Call to confirm funds and deadlines.',callToConfirm:true,notes:'Apply early and keep a backup plan.'}
];
const scripts={
shelter211:{title:'211 shelter request',who:'211',ready:['location or zip code','household size','children ages','pets or service animal','medical or disability needs'],say:['Hi, I need help finding emergency shelter tonight.','I am located in [area].','There are [number] people in my household.','Please note: [children / medical need / pet / service animal].','Can you tell me what options I should call right now?'],ask:['What shelters may have openings tonight?','Is there safe parking or a day center?','What time should I call back?'],no:'Ask for the nearest day center, safe parking, warming/cooling center, and morning callback time.',after:'Log the call, save any reference number, and call again in the morning if no bed is open.'},
shelterCall:{title:'shelter call',who:'shelter intake line',ready:['household size','current location','accessibility needs','pet or service animal information'],say:['Hi, I am looking for emergency shelter.','There are [number] people in my household.','Do you have openings or an intake list today?'],ask:['What time should I arrive or call back?','What documents do I need?','If no bed is open, what is the next safest step?'],no:'Ask for the next intake time and one other place to call.',after:'Log the call and set the next intake time.'},
ce:{title:'Coordinated Entry / RAP call',who:'Regional Access Point or Coordinated Entry contact',ready:['household names and ages','current sleeping situation','income if any','disability or medical needs','prior CE history'],say:['Hi, I am calling to ask about Coordinated Entry.','My current sleeping situation is [status].','There are [number] people in my household.','Can you tell me how to schedule an assessment?'],ask:['What should I bring?','How long is the wait?','What happens after assessment?','How do I check status?'],no:'Ask for the status inquiry process and another access point or callback time.',after:'Keep CE as one track, not the only track. Add the next follow-up date.'},
voucher:{title:'landlord with voucher',who:'landlord or leasing office',ready:['voucher bedroom size','payment standard if known','move-in timeline','PHA contact','income documents'],say:['Hi, I am calling about a rental you have available.','I am a Housing Choice Voucher holder.','I want to ask whether the unit could work with the voucher process.','Is this a good time to ask a few questions?'],ask:['What is the rent?','Would you work with the housing authority paperwork?','When is the unit available?','Can I schedule a showing?'],no:'Ask for the reason in writing and save the date, time, person, and exact words.',after:'Log the contact and start RFTA/RTA steps if the unit may work.'},
rfta:{title:'RFTA/RTA paperwork',who:'PHA worker or landlord',ready:['unit address','landlord contact','requested rent','utility responsibility','lease start date'],say:['Hi, I am ready to start tenancy approval paperwork.','Can you confirm which forms are needed and where they should be sent?','I want to make sure inspection can be scheduled quickly.'],ask:['Who fills out each section?','What is the deadline?','How do I confirm it was received?'],no:'Ask what exact item is missing and who must provide it.',after:'Save submission proof and set an inspection follow-up.'},
arch:{title:'ARCH property manager',who:'property manager',ready:['bedroom size','income estimate','voucher info if applicable','phone and email'],say:['Hi, I am looking for affordable housing.','I found your property through ARCH and wanted to ask a few questions.','Are you taking applications or is there a waitlist?'],ask:['What is the income limit?','Do you accept vouchers?','How do I apply?','When should I check back?'],no:'Ask when to check again and save that date. ARCH is not a central waitlist.',after:'Log the call and save the next check date.'},
legalNotice:{title:'legal aid notice call',who:'legal aid or tenant hotline',ready:['notice type','date on notice','court date if any','lease if available','household details'],say:['Hi, I received a housing notice dated [date].','The notice says [type / I am not sure].','I need help understanding what step to take before the deadline.','Can I speak with someone today?'],ask:['What documents should I send?','Is there a response deadline?','Should I apply for rent assistance now?'],no:'Ask for another tenant hotline and the safest next step before the deadline. This is not legal advice.',after:'Photograph the notice, save the envelope, log the call, and set a reminder.'},
rent:{title:'rent assistance call',who:'rental assistance program',ready:['amount owed','landlord contact','notice if any','income proof','lease or ledger'],say:['Hi, I need help applying for rent assistance.','I owe about [amount] and my deadline is [date].','Can you tell me how to apply and what documents are required?'],ask:['Are applications open?','Can assistance be paid directly to the landlord?','Can I get confirmation after applying?'],no:'Ask where to apply next and whether emergency funds are available for households with a notice.',after:'Save confirmation and tell legal aid if a deadline exists.'},
utility:{title:'utility assistance call',who:'utility assistance provider',ready:['utility account number','shutoff notice','income proof','address'],say:['Hi, I need help with utility assistance.','My utility is [electric / gas / water] and the deadline is [date].','What help is available and what documents do you need?'],ask:['Can this stop shutoff?','How long does processing take?','Can I get written confirmation?'],no:'Ask about payment plan or hold while another application is pending.',after:'Log the call and add the shutoff date to the plan.'},
follow:{title:'follow-up after no response',who:'program, landlord, or agency',ready:['last call date','reference number','what you asked for','deadline'],say:['Hi, I am following up on my call from [date].','I was told [what they said] and have not heard back yet.','My deadline is [date], so I need to confirm the next step today.'],ask:['Who is handling this?','What is the status?','What should I do next?','Can you send that in writing?'],no:'Ask for a supervisor, alternate contact, or written status process.',after:'Log the attempt and set another follow-up.'},
denial:{title:'denial documentation',who:'property manager or program',ready:['property name','date of denial','exact words used','screenshots or email','voucher info if relevant'],say:['Hi, I am calling about my rental inquiry or application for [property].','I was told I was denied or could not apply.','Can you send me the reason in writing?'],ask:['What screening criteria was used?','Was my voucher considered?','Who can I follow up with?'],no:'Write down that they refused to give a reason and save the call details.',after:'Save as proof and consider legal aid or fair housing support if discrimination may be involved.'},
voicemail:{title:'voicemail script',who:'any housing contact',ready:['your name','safe callback method','reason for calling','deadline'],say:['Hi, my name is [name].','I am calling about [reason].','My deadline is [date].','Please call or text me back at [safe contact]. Thank you.'],ask:['Ask for a callback','Ask for the next step'],no:'If no response within the callback window, use the follow-up script.',after:'Log the voicemail date and time.'},
writing:{title:'ask for it in writing',who:'landlord, PHA, program, or agency',ready:['what they told you','email or mailing address','deadline'],say:['Thank you for explaining that.','Can you please send that to me in writing?','I am keeping records for my housing plan.'],ask:['Can you email it?','Who should I contact if I do not receive it?'],no:'Write down the exact words, date, time, and person you spoke with.',after:'Log the call and save any text, email, or voicemail.'}
};
let state=load();let modal='';let tele=null;
function load(){try{return Object.assign({q:0,answers:{},started:false,logs:[],savedScripts:[],proof:[],followups:[]},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{q:0,answers:{},started:false,logs:[],savedScripts:[],proof:[],followups:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function a(id){return state.answers[id]||(isMulti(id)?[]:'')}function isMulti(id){return['household','barriers','strengths'].includes(id)}function setAnswer(id,v){state.answers[id]=v;state.started=true;save();render()}function toggle(id,opt){let arr=Array.isArray(a(id))?a(id):[];arr=arr.includes(opt)?arr.filter(x=>x!==opt):arr.concat(opt);setAnswer(id,arr)}
function plan(){const x=state.answers;const barriers=x.barriers||[];const strengths=x.strengths||[];const unsafe=['No, I need help tonight',"I'm not sure"].includes(x.safeTonight)||['No','Maybe, but it is not stable'].includes(x.sleepTonight)||['sleeping outside','sleeping in a vehicle','emergency shelter'].includes(x.status);const notice=['received a notice','eviction case filed'].includes(x.status)||['notice date','court date'].includes(x.deadlineType);const voucher=x.status==='voucher holder searching for a unit'||x.deadlineType==='voucher expiration'||strengths.includes('voucher');const arch=x.status==='long-term affordable housing seeker'||String(x.area||'').toLowerCase().match(/bellevue|redmond|kirkland|issaquah|bothell|kenmore|east/);const basic=barriers.some(b=>['food','utilities setup','phone/internet','no phone','no transportation','move-in funds','furniture','household supplies',"renter's insurance"].includes(b));const paths=[];if(unsafe)paths.push('Shelter Survival Plan');if(notice)paths.push('Notice Triage');if(voucher)paths.push('Voucher Lease-Up');if(arch)paths.push('ARCH / East King County Affordable Housing');if(barriers.length)paths.push('Barrier-Clearing');if(basic)paths.push('Basic Needs Stabilization');paths.push('Stay-Housed Starter');const crisis=unsafe||x.status==='eviction case filed'?'Critical':notice?'High':x.status?'Moderate':'Stable-Seeking';const urgency=crisis==='Critical'?'Immediate':crisis==='High'?'Short-term':'Planning';const first=unsafe?'Call 211 now and ask for emergency shelter, day centers, safe parking, and a morning callback time.':notice?'Call legal aid with the notice type, notice date, and deadline. This is not legal advice.':voucher?'Check the voucher expiration date and make one landlord call using the voucher script.':barriers.length?'Start the first barrier-clearing step and save proof.':'Finish the intake so the housing plan can give one clear next step.';return{unsafe,notice,voucher,arch,basic,paths,crisis,urgency,first}}
function neededScripts(p){let ids=['follow','voicemail','writing'];if(p.unsafe)ids.unshift('shelter211','shelterCall','ce');if(p.voucher)ids.unshift('voucher','rfta');if(p.arch)ids.unshift('arch');if(p.notice)ids.unshift('legalNotice','rent');if(p.basic)ids.unshift('utility');ids.push('denial');return[...new Set(ids)]}
function matchedResources(p){return sampleResources.filter(r=>r.relatedPathways.some(path=>p.paths.includes(path)||path==='Coordinated Entry Decoder')||r.relatedBarriers.some(b=>(state.answers.barriers||[]).includes(b))).slice(0,5)}
function app(){if(!state.started)return firstScreen();const p=plan();return `<div class="wrap"><div class="top no-print"><div><div class="brand">Decoded Housing</div><div class="tag">Self-Help Housing Counselor MVP</div></div><div class="row"><button class="btn" onclick="print()">Print plan</button><button class="btn ghost" onclick="startOver()">Start over</button></div></div><div class="layout"><main>${questionCard()}${fullPlan(p)}</main><aside class="plan">${livePlan(p)}</aside></div></div>${modal}${tele?teleModal():''}`}
function firstScreen(){const saved=localStorage.getItem(KEY);return `<section class="hero"><div class="hero-card"><p class="eyebrow">Decoded Housing</p><h1>Get housed. Stay housed.</h1><p class="muted">We'll start with safety, then build your housing plan one step at a time.</p><h2>Are you safe tonight?</h2><div class="choices">${questions[0].options.map(o=>`<button class="choice" onclick="setAnswer('safeTonight','${esc(o)}');state.q=1;save();render()">${o}</button>`).join('')}${saved?'<button class="choice" onclick="continueSaved()">Continue saved plan</button>':''}</div><p class="small muted" style="margin-top:18px">Your plan saves only on this device with localStorage.</p></div></section>`}
function questionCard(){const q=questions[state.q]||questions[questions.length-1];const pct=Math.round(((state.q+1)/questions.length)*100);return `<div class="card no-print"><div class="progress"><div class="bar" style="width:${pct}%"></div></div><p class="eyebrow">Question ${state.q+1} of ${questions.length}</p><h1>${q.q}</h1>${q.hint?`<p class="muted">${q.hint}</p>`:''}${input(q)}<div class="row section"><button class="btn" onclick="prevQ()">Back</button><button class="btn primary" onclick="nextQ()">${state.q===questions.length-1?'Open My Housing Plan':'Continue'}</button></div></div>`}
function input(q){if(q.type==='date')return `<label class="field"><input type="date" value="${a(q.id)}" onchange="setAnswer('${q.id}',this.value)"></label>`;if(q.type==='text')return `<label class="field"><input placeholder="${q.placeholder||''}" value="${a(q.id)}" oninput="setAnswer('${q.id}',this.value)"></label>`;if(q.type==='multi')return `<div class="choices two">${q.options.map(o=>`<button class="choice ${a(q.id).includes(o)?'active':''}" onclick="toggle('${q.id}','${esc(o)}')">${o}</button>`).join('')}</div>`;return `<div class="choices">${q.options.map(o=>`<button class="choice ${a(q.id)===o?'active':''}" onclick="setAnswer('${q.id}','${esc(o)}')">${o}</button>`).join('')}</div>`}
function livePlan(p){return `<p class="eyebrow">Live My Housing Plan</p><h2>${p.crisis} / ${p.urgency}</h2><p><strong>Housing goal:</strong> ${goal(p)}</p><p><strong>Today's first step:</strong> ${p.first}</p><h3>This week's steps</h3><ul class="list"><li>${p.first}</li><li>${state.answers.deadlineDate?'Handle deadline by '+state.answers.deadlineDate:'Add any hard deadline.'}</li><li>${(state.answers.barriers||[])[0]?'Start clearing: '+state.answers.barriers[0]:'Gather documents already available.'}</li><li>Log calls and save proof.</li></ul><h3>Active pathways</h3><div class="row">${p.paths.map(x=>`<span class="pill">${x}</span>`).join('')}</div><h3>Follow-up dates</h3><ul class="list">${state.followups.map(f=>`<li>${f.date} - ${f.label}</li>`).join('')||'<li>Add follow-ups after calls.</li>'}</ul></div>`}
function fullPlan(p){return `<div class="card section"><p class="eyebrow">My Housing Plan</p><h1>Get housed. Stay housed.</h1><div class="row"><span class="pill">Crisis: ${p.crisis}</span><span class="pill">Urgency: ${p.urgency}</span></div><div class="section"><h2>Pathway lanes</h2><div class="grid">${lanes(p).map(l=>lane(l)).join('')}</div></div><div class="section"><h2>Documents to gather</h2>${checks(['Photo ID if available','Birth certificate or Social Security card if needed','Proof of income or benefits','Any notice, court paper, denial, voucher paperwork, or application confirmation'])}</div><div class="section"><h2>Barriers to clear</h2>${checks((state.answers.barriers||[]).length?(state.answers.barriers||[]).map(b=>`${b}: take the first clearing step and save proof.`):['No barriers selected yet.'])}</div><div class="section"><h2>Calls to make and phone scripts</h2><div class="grid two">${neededScripts(p).map(scriptCard).join('')}</div></div><div class="section"><h2>Fallback plan</h2><div class="note">${fallback(p)}</div></div><div class="section"><h2>Move-in needs</h2>${checks(['Deposit and first month plan','Utilities start date','Basic furniture','Household supplies','Food support','Transportation','Phone or internet','Renter\'s insurance if required'])}</div><div class="section"><h2>Stay-housed needs</h2>${checks(['Rent due reminder','Utility payment reminder','Benefits renewal reminder','Repair request script','Notice response plan','Voucher recertification date if applicable'])}</div><div class="section"><h2>What to save as proof</h2>${checks(['Application confirmations','Denial notices','Call logs and voicemails','Landlord or PHA emails','Inspection dates and outcomes','Accommodation requests','Receipts and payment confirmations'].concat(state.proof))}</div><div class="section"><h2>Matched support options</h2><p class="muted">Matched sample resources appear here only inside My Housing Plan. This is not a directory. Call to confirm before relying on any information.</p><div class="grid two">${matchedResources(p).map(resourceCard).join('')||'<p class="muted">Answer more questions to match support options.</p>'}</div></div><div class="section"><h2>Call Log</h2><button class="btn primary no-print" onclick="openLog()">Add call log</button><div class="grid" style="margin-top:12px">${state.logs.map(log=>`<div class="log"><strong>${log.date} - ${log.who}</strong><br>${log.notes||''}<br><span class="muted small">Answered: ${log.answered}. Follow-up: ${log.followDate||'none'}. Proof: ${log.proof?'yes':'no'}</span>${log.saidNo==='Yes'?'<p class="urgent lane"><strong>Next step:</strong> document the denial and ask for it in writing.</p>':''}</div>`).join('')||'<p class="muted">No calls logged yet.</p>'}</div></div></div>`}
function lanes(p){return[{name:'Safety / Tonight',next:p.unsafe?p.first:'Confirm tonight remains safe and keep a backup contact method.',why:'Safety comes before applications.',script:p.unsafe?'shelter211':null,due:p.unsafe?'Today':'As needed',proof:'211 call log, shelter names, reference numbers',fallback:'Ask about day centers, safe parking, and a morning callback time.'},{name:'Deadlines',next:state.answers.deadlineType&&state.answers.deadlineType!=='no known deadline'?`Handle ${state.answers.deadlineType}${state.answers.deadlineDate?' by '+state.answers.deadlineDate:''}.`:'Add any known notice, court, voucher, shelter, utility, or application date.',why:'Missed deadlines can close options.',script:p.notice?'legalNotice':p.voucher?'follow':null,due:state.answers.deadlineDate||'No date entered',proof:'Notice photos, emails, call logs, submission confirmations',fallback:'Ask for the deadline in writing.'},{name:'Housing Search',next:p.voucher?'Make one landlord voucher call.':p.arch?'Call one ARCH or affordable property directly.':'Keep one housing search step active.',why:'Real housing navigation runs parallel tracks.',script:p.voucher?'voucher':p.arch?'arch':'follow',due:'This week',proof:'Property name, date, answer, denial reason if any',fallback:'Use the follow-up script and ask for it in writing.'},{name:'Documents / Barriers',next:(state.answers.barriers||[])[0]?`Start clearing ${(state.answers.barriers||[])[0]}.`:'Gather available documents.',why:'Practical barriers often block housing access.',script:'writing',due:'This week',proof:'Photos, receipts, written requests',fallback:'Ask what can be submitted temporarily.'},{name:'Calls / Follow-ups',next:'Use scripts, log calls, and set follow-up dates.',why:'Documentation makes the plan easier to continue.',script:'follow',due:'After every call',proof:'Call log, voicemail date, staff name, reference number',fallback:'Ask for a supervisor, alternate contact, or written status process.'},{name:'Move-In / Stay Housed',next:'Save rent, utility, recertification, and repair reminders as they become known.',why:'Move-in is not the finish line.',script:'utility',due:'After approval or move-in',proof:'Receipts, utility confirmations, lease dates, repair requests',fallback:'If rent, utilities, benefits, or voucher status is at risk, contact support the same day.'}]}
function lane(l){return `<div class="lane"><h3>${l.name}</h3><p><strong>Next action:</strong> ${l.next}</p><p><strong>Why it matters:</strong> ${l.why}</p>${l.script?`<p><strong>Script/resource:</strong> <button class="btn" onclick="openScript('${l.script}')">${scripts[l.script].title}</button></p>`:''}<p><strong>Due:</strong> ${l.due}</p><p><strong>Proof to save:</strong> ${l.proof}</p><p><strong>Fallback:</strong> ${l.fallback}</p>${realityFor(l.name)}</div>`}
function realityFor(name){const p=plan();let notes=[];if(name==='Safety / Tonight'&&p.unsafe)notes.push(['A shelter list does not mean a bed is open tonight. Call to confirm.','Backup: ask about day centers, safe parking, and a morning callback time.']);if(name==='Housing Search'&&p.voucher)notes.push(['A voucher does not guarantee a landlord will complete paperwork. Track every landlord contact.','Backup: keep calling additional landlords and ask for denials in writing.']);if(name==='Housing Search'&&p.arch)notes.push(['ARCH is not a central waitlist. You must contact properties directly.','Backup: set a next check date for each property.']);if(name==='Deadlines'&&p.notice)notes.push(['Rent assistance can close or run out of funds. Apply early and keep a backup plan.','Backup: call legal aid if a notice or court date exists.']);return notes.map(n=>`<div class="note"><strong>Reality note:</strong> ${n[0]}<br><span class="muted">${n[1]}</span></div>`).join('')}
function scriptCard(id){const s=scripts[id];return `<div class="script"><p class="eyebrow">Phone script</p><h3>${s.title}</h3><p><strong>Who to call:</strong> ${s.who}</p><p><strong>What to have ready:</strong> ${s.ready.join(', ')}</p><p><strong>Exact words:</strong> ${s.say[0]}</p><p><strong>What to ask:</strong> ${s.ask.join('; ')}</p><p><strong>If they say no:</strong> ${s.no}</p><p><strong>After the call:</strong> ${s.after}</p><div class="row no-print"><button class="btn primary" onclick="openScript('${id}')">Open teleprompter</button><button class="btn" onclick="openLog('${id}')">Log call</button><button class="btn" onclick="saveScript('${id}')">Save script</button></div></div>`}
function resourceCard(r){const why=r.relatedPathways.find(x=>plan().paths.includes(x))||r.relatedBarriers.find(b=>(state.answers.barriers||[]).includes(b))||r.category;return `<div class="resource"><p class="eyebrow">${r.category}</p><h3>${r.name}</h3><p><strong>Why it matched:</strong> ${why}</p><p><strong>What it helps with:</strong> ${r.whatItHelpsWith}</p><p><strong>What to ask for:</strong> ${r.whatToAskFor}</p><p><strong>Contact:</strong> ${r.phone||'call to confirm'} ${r.website?` | ${r.website}`:''}</p><p><strong>Documents ready:</strong> ${r.documentsNeeded.join(', ')}</p><p class="small muted">Last checked: ${r.lastChecked}. Source: ${r.sourceLabel}. Verification: ${r.verificationStatus}. ${r.staleWarning}</p><p><strong>Call to confirm before relying on this.</strong></p><div class="row no-print"><button class="btn" onclick="saveProof('Saved resource: ${esc(r.name)}')">Save to plan</button><button class="btn" onclick="openLog('${r.scriptType}')">Log call</button></div></div>`}
function checks(items){return `<div class="grid">${items.map(i=>`<label class="lane"><input type="checkbox"> ${i}</label>`).join('')}</div>`}
function goal(p){if(p.unsafe)return'Get a safer place tonight while starting parallel housing steps.';if(p.notice)return'Protect housing before the deadline and save proof.';if(p.voucher)return'Use the voucher before expiration and document every landlord contact.';return'Build a realistic housing plan with next steps, scripts, proof, and follow-up.'}function fallback(p){if(p.unsafe)return'If no bed is available tonight, ask about day centers, safe parking, and the first time to call again tomorrow.';if(p.notice)return'If legal aid cannot answer today, save the notice, apply for rent assistance if relevant, and call another tenant support line. This is not legal advice.';return'If the first step does not work by the follow-up date, use the follow-up script and ask for a written next step.'}
function openScript(id){tele={id,i:0,closed:false};render()}function teleModal(){const s=scripts[tele.id];return `<div class="modal"><div class="modal-card"><p class="eyebrow">Teleprompter Mode</p><h2>${s.title}</h2><div class="tele-line">${s.say[tele.i]}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="tele.i=Math.max(0,tele.i-1);render()">Previous line</button><button class="btn primary" onclick="tele.i=Math.min(${s.say.length-1},tele.i+1);render()">Next line</button><button class="btn" onclick="tele=null;openLog('${tele.id}')">Close and log call</button><button class="btn" onclick="tele=null;render()">Close</button></div></div></div>`}
function openLog(scriptId=''){modal=`<div class="modal"><div class="modal-card"><h2>Log this call</h2><div class="grid two"><label class="field">Date<input id="ldate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field">Who was called?<input id="lwho" value="${scriptId&&scripts[scriptId]?scripts[scriptId].who:''}"></label><label class="field">Phone number<input id="lphone"></label><label class="field">Did they answer?<select id="lanswered"><option>Yes</option><option>No - voicemail</option><option>No answer</option></select></label><label class="field">Who did you speak with?<input id="lperson"></label><label class="field">Did they give a deadline?<input id="ldeadline" type="date"></label><label class="field">Did they say no?<select id="lsaidno"><option>No</option><option>Yes</option></select></label><label class="field">Follow-up date?<input id="lfollow" type="date"></label></div><label class="field" style="margin-top:12px">What did they say?<textarea id="lnotes"></textarea></label><label class="field">What reason did they give?<input id="lreason"></label><label><input id="lproof" type="checkbox" checked> Save as proof?</label><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveLog()">Save call log</button><button class="btn" onclick="modal='';render()">Cancel</button></div></div></div>`;render()}function saveLog(){const log={date:g('ldate'),who:g('lwho'),phone:g('lphone'),answered:g('lanswered'),person:g('lperson'),notes:g('lnotes'),deadline:g('ldeadline'),saidNo:g('lsaidno'),reason:g('lreason'),followDate:g('lfollow'),proof:document.getElementById('lproof').checked};state.logs.unshift(log);if(log.followDate)state.followups.push({date:log.followDate,label:'Follow up with '+(log.who||'contact')});if(log.proof)state.proof.push('Call log: '+(log.who||'contact')+' on '+log.date);if(log.saidNo==='Yes')state.proof.push('Document the denial and ask for it in writing.');modal='';save();render()}function g(id){return document.getElementById(id).value}
function saveScript(id){if(!state.savedScripts.includes(id))state.savedScripts.push(id);save();render()}function saveProof(x){if(!state.proof.includes(x))state.proof.push(x);save();render()}function nextQ(){if(state.q<questions.length-1)state.q++;save();render()}function prevQ(){if(state.q>1)state.q--;else state.q=0;save();render()}function continueSaved(){state=load();state.started=true;render()}function startOver(){if(confirm('Start over and clear the saved plan on this device?')){localStorage.removeItem(KEY);state=load();render()}}function esc(s){return String(s).replace(/'/g,"\\'")}function render(){document.getElementById('app').innerHTML=app()}render();
</script></body></html>
