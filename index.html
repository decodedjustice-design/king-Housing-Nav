function val(q){const m={safeTonight:S.safety.safeTonight,sleep:S.safety.safePlaceToSleepTonight,danger:S.safety.immediateDangerFlag?'Yes':'No',contact:S.contactSafety.safeForProgramsToCallTextEmailMail,private:S.contactSafety.privateContactNeed,status:S.currentSituation.currentHousingStatus,deadlineType:S.deadlines.deadlineType,deadlineDate:S.deadlines.deadlineDate,householdSize:S.household.householdSize,children:S.household.hasChildren?'Yes':'No',childrenCount:S.household.childrenCount,childrenAges:S.household.childrenAges,disability:S.disabilityAccommodation.disabilityMedicalAccessibilityNeed,unitNeeds:S.disabilityAccommodation.accessibilityUnitNeeds,barriers:selectedBarriers(),strengths:selectedStrengths(),income:S.incomeBenefits.incomeBenefitsStatus,history:[],area:S.profile.cityAreaGoal,avoid:S.profile.areasToAvoid};if(q.id==='householdFlags'){const h=S.household,a=[];if(h.householdSize==='1')a.push('just me');if(h.hasChildren)a.push('children');if(h.pregnantPerson)a.push('pregnant person');if(h.seniorOrElder)a.push('senior/elder');if(h.pets)a.push('pets');if(h.serviceAnimal)a.push('service animal');if(h.veteran)a.push('veteran');if(h.youthYoungAdult)a.push('youth/young adult');if(h.reentryFromJailPrison)a.push('reentry from jail/prison');return a}return m[q.id]||''}
function compute(){const status=S.currentSituation.currentHousingStatus,b=selectedBarriers();const unsafe=S.safety.immediateDangerFlag||['No, I need help tonight',"I'm not sure"].includes(S.safety.safeTonight)||['No','Maybe, but it is not stable'].includes(S.safety.safePlaceToSleepTonight)||['sleeping outside','sleeping in a vehicle','emergency shelter'].includes(status);const notice=['received a notice','eviction case filed'].includes(status)||['notice date','court date','must leave by date'].includes(S.deadlines.deadlineType);const voucher=S.voucherSubsidy.hasVoucherOrSubsidy||S.deadlines.deadlineType==='voucher expiration'||S.strengths.voucher;const arch=status==='long-term affordable housing seeker'||/bellevue|redmond|kirkland|issaquah|bothell|kenmore|east/i.test(S.profile.cityAreaGoal||'');const disability=S.disabilityAccommodation.reasonableAccommodationMayApply||S.disabilityAccommodation.accessibilityUnitNeeds.length>0||S.barriers.householdSpecialNeeds.disabilityAccommodation;const privateNeed=S.contactSafety.useNeutralSafetyLanguage||S.barriers.householdSpecialNeeds.safetyPrivateContact;const basic=S.incomeBenefits.basicNeedsTriggered||Object.values(S.barriers.moveInBasicNeeds).some(Boolean)||S.barriers.communicationAccess.transportationBarrier||S.barriers.householdSpecialNeeds.childcare;const paths=[];if(unsafe)paths.push('Shelter Survival Plan');if(notice)paths.push('Notice Triage');if(voucher)paths.push('Voucher Lease-Up');if(arch)paths.push('ARCH / East King County Affordable Housing');if(b.length)paths.push('Barrier-Clearing');if(basic)paths.push('Basic Needs Stabilization');if(disability)paths.push('Disability / Accommodation');if(privateNeed)paths.push('Safety / Private Contact');paths.push('Stay-Housed Starter');const crisis=unsafe||status==='eviction case filed'?'Critical':notice||S.deadlines.urgentDeadlineFlag?'High':status?'Moderate':'Stable-Seeking';const urgency=crisis==='Critical'?'Immediate':crisis==='High'?'Short-term':'Planning';return{statu function makePlan(){const c=compute();const first=c.unsafe?'Call 211 now and ask for shelter, day centers, safe parking, and a morning callback time.':c.notice?'Call legal aid with the notice type, notice date, and deadline. This is not legal advice.':c.voucher?'Check the voucher expiration date and make one landlord call using the voucher script.':c.disability?'Prepare a reasonable accommodation request without sharing diagnosis details in this tool.':c.b.length?'Start the first barrier-clearing step and save proof.':'Finish the intake so the housing plan can give one clear next step.';const next=[{title:c.unsafe?'Call 211 for tonight':'Confirm the most urgent deadline',why:c.unsafe?'Safe sleep comes before applications.':'Deadlines decide what comes first.',scriptType:c.unsafe?'shelter211':c.notice?'legalNotice':'follow',followUpDate:S.deadlines.deadlineDate||''},{title:c.notice?'Call legal aid':'Gather top documents',why:c.notice?'A notice or court date needs fast review. This is not legal advice.':'Documents prevent delays when an opening appears.',scriptType:c.notice?'legalNotice':'writing',followUpDate:''},{title:c.voucher?'Make one landlord voucher call':c.b[0]?'Clear barrier: '+c.b[0]:'Log the next housing contact',why:c.voucher?'Voucher lease-up needs tracked landlord contacts.':'Saved proof helps the plan continue later.',scriptType:c.voucher?'voucher':'follow',followUpDate:''}];const p={crisisLevel:c.crisis,urgencyLevel:c.urgency,housingGoal:c.unsafe?'Get a safer place tonight while starting parallel housing steps.':c.notice?'Protect housing before the deadline and save proof.':c.voucher?'Use the voucher before expiration and document every landlord contact.':'Build a realistic housing plan with next steps, scripts, proof, and follow-up.',todayFirstStep:first,whyThisComesFirst:c.unsafe?'Safety comes before program lists.':c.notice?'A housing deadline can change what must happen today.':'A clear next step keeps the plan usable.',nextThreeActions:next,activ function lanes(c){return['Safety / Tonight','Deadlines','Housing Search','Documents / Barriers','Calls / Follow-ups','Move-In / Stay Housed'].map(name=>({name,next:name==='Safety / Tonight'?(c.unsafe?S.plan.todayFirstStep:'Confirm tonight remains safe and keep a backup contact method.'):name==='Deadlines'?(S.deadlines.hasDeadline?`Handle ${S.deadlines.deadlineType} ${S.deadlines.deadlineDate||''}`:'Add any known hard deadline.'):name==='Housing Search'?(c.voucher?'Make one landlord voucher call.':c.arch?'Call one ARCH or affordable property directly.':'Keep one housing search step active.'):name==='Documents / Barriers'?(c.b[0]?`Start clearing ${c.b[0]}.`:'Gather available documents.'):name==='Calls / Follow-ups'?'Use scripts, log calls, and set follow-up dates.':'Save rent, utility, recertification, and repair reminders as they become known.',why:name==='Safety / Tonight'?'Safety comes before applications.':name==='Deadlines'?'Missed deadlines can close options.':'This keeps the plan moving.',scriptType:name==='Safety / Tonight'&&c.unsafe?'shelter211':name==='Deadlines'&&c.notice?'legalNotice':name==='Housing Search'&&c.voucher?'voucher':name==='Housing Search'&&c.arch?'arch':'follow',due:name==='Deadlines'?(S.deadlines.deadlineDate||'No date entered'):'This week',proof:'Call logs, written notices, screenshots, receipts, and confirmations.',fallback:'Ask for the next step in writing and set a follow-up date.'}))}

function firstScreen(){const saved=!!localStorage.getItem(KEY);return `<section class="hero"><div class="hero-card"><p class="eyebrow">Decoded Housing</p><h1>Get housed. Stay housed.</h1><p class="muted">We'll start with safety, then build your housing plan one step at a time.</p><p class="note">Your answers are saved on this device so your plan can continue later.</p><h2>Are you safe tonight?</h2><div class="choices">${questions[0].options.map(o=>`<button class="choice" onclick="answerFirst('${esc(o)}')">${o}</button>`).join('')}${saved?'<button class="choice" onclick="continueSaved()">Continue my housing plan</button><button class="choice" onclick="startOver()">Start over</button>':''}</div></div></section>`}

function fullPlan(){const p=S.plan;return `<div class="card"><p class="eyebrow">My Housing Plan</p><h1>Get housed. Stay housed.</h1><div class="note"><h2>Top Priority</h2><p><strong>${p.crisisLevel} / ${p.urgencyLevel}</strong></p><p>${p.todayFirstStep}</p><p class="muted">${p.whyThisComesFirst}</p></div><div class="section"><h2>Next 3 Actions</h2><div class="grid">${p.nextThreeActions.map(a=>`<div class="box"><strong>${a.title}</strong><p>${a.why}</p>${a.scriptType?`<button class="btn" onclick="openScript('${a.scriptType}')">Script</button>`:''}</div>`).join('')}</div></div><div class="section"><h2>Active Pathways</h2><div class="row">${p.activePathways.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div><div class="section"><h2>Calls to Make</h2><div class="grid">${p.callsToMake.map(c=>`<div class="lane"><h3>${c.who}</h3><p>${c.why}</p><button class="btn" onclick="openScript('${c.scriptType}')">Script</button> <button class="btn" onclick="openLog('${c.scriptType}')">Log call</button></div>`).join('')||'<p class="muted">No calls matched yet.</p>'}</div></div><div class="section"><h2>Documents to Gather</h2>${checks(p.documentsToGather.slice(0,8))}</div><div class="section"><h2>Matched Support Options</h2><p class="muted">Sample resources appear only inside My Housing Plan. Call to confirm before relying on this.</p><div class="grid">${shownResources().map(resourceCard).join('')||'<p class="muted">Answer more questions to match support options.</p>'}</div>${p.matchedResourceIds.length>3&&!showAllResources?'<button class="btn" onclick="showAllResources=true;render()">Show more matched options</button>':''}</div><div class="section"><h2>Follow-Up Dates</h2><ul class="list">${S.followUps.map(f=>`<li>${f.dueDate} - ${f.title} (${f.status})</li>`).join('')||'<li>No follow-up dates saved yet.</li>'}</ul></div><div class="section"><h2>Proof to Save</h2>${checks(p.proofToSave.concat(S.evidenceEvents.map(e=>e.description)).slice(0,12))}</div><details class="section function reality(name){const c=compute();let t='';if(name==='Safety / Tonight'&&c.unsafe)t='A shelter list does not mean a bed is open tonight. Backup: ask about day centers, safe parking, and a morning callback time.';if(name==='Housing Search'&&c.voucher)t='A voucher does not guarantee a landlord will complete paperwork. Backup: track every landlord contact and keep calling.';if(name==='Housing Search'&&c.arch)t='ARCH is not a central waitlist. Backup: contact properties directly and set check-back dates.';if(name==='Deadlines'&&c.notice)t='Rent assistance can close or run out of funds. Backup: apply early and call legal aid if a notice or court date exists.';return t?`<div class="note"><strong>Reality note:</strong> ${t}</div>`:''}
function answer(v){cq().save(v);save();render()}function toggle(o){const q=cq(),a=val(q).slice(),n=a.includes(o)?a.filter(x=>x!==o):a.concat(o);q.save(n);save();render()}function nextQ(){if(qi()<activeQs().length-1)S.profile.currentStep=qi()+1;else S.profile.intakeComplete=true;save();render()}function prevQ(){if(qi()>0)S.profile.currentStep=qi()-1;save();render()}function answerFirst(v){questions[0].save(v);S.profile.currentStep=1;save();render()}function continueSaved(){S=load();if(!S.profile.intakeComplete)S.profile.currentStep=Math.max(S.profile.currentStep,1);save();render()}function startOver(){if(confirm('Start over and clear the saved plan on this device?')){localStorage.removeItem(KEY);S=blank();modal='';tele=null;render()}}
function openScript(id){tele={id,i:0};render()}function teleModal(){const s=scripts[tele.id];return `<div class="modal"><div class="modal-card"><p class="eyebrow">Teleprompter Mode</p><h2>${s.title}</h2><div class="tele-line">${s.say[tele.i]}</div><div class="row section"><button class="btn" onclick="tele.i=Math.max(0,tele.i-1);render()">Previous line</button><button class="btn primary" onclick="tele.i=Math.min(${s.say.length-1},tele.i+1);render()">Next line</button><button class="btn" onclick="const id=tele.id;tele=null;openLog(id)">Close and log call</button><button class="btn" onclick="tele=null;render()">Close</button></div></div></div>`}
function openLog(scriptType='',resourceId=''){const who=scriptType&&scripts[scriptType]?scripts[scriptType].who:'';modal=`<div class="modal"><div class="modal-card"><h2>Log this call</h2><div class="grid two"><label class="field">Date<input id="ldate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field">Who was called?<input id="lwho" value="${who}"></label><label class="field">Phone number<input id="lphone"></label><label class="field">Did they answer?<select id="lanswered"><option>Yes</option><option>No - voicemail</option><option>No answer</option></select></label><label class="field">Who did you speak with?<input id="lperson"></label><label class="field">Did they give a deadline?<select id="ldeadlinegiven"><option>No</option><option>Yes</option></select></label><label class="field">Deadline date<input id="ldeadline" type="date"></label><label class="field">Did they say no?<select id="lsaidno"><option>No</option><option>Yes</option></select></label><label class="field">Follow-up needed?<select id="lfollowneeded"><option>No</option><option>Yes</option></select></label><label class="field">Follow-up date<input id="lfollow" type="date"></label></div><label class="field section">What did they say?<textarea id="lnotes"></textarea></label><label class="field">What reason did they give?<input id="lreason"></label><label><input id="lproof" type="checkbox" checked> Save as proof?</label><div class="row section"><button class="btn primary" onclick="saveLog('${scriptType}','${resourceId}')">Save call log</button><button class="btn" onclick="modal='';render()">Cancel</button></div></div></div>`;render()}
function pathForScript(id){return{shelter211:'Shelter Survival Plan',ce:'Shelter Survival Plan',voucher:'Voucher Lease-Up',rfta:'Voucher Lease-Up',arch:'ARCH / East King County Affordable Housing',legalNotice:'Notice Triage',rent:'Notice Triage',utility:'Basic Needs Stabilization',accommodation:'Disability / Accommodation'}[id]||''}
function g(id){return document.getElementById(id).value}function saveLog(scriptType='',resourceId=''){const log={id:uid(),date:g('ldate'),whoCalled:g('lwho'),phoneNumber:g('lphone'),didAnswer:g('lanswered'),spokeWith:g('lperson'),whatTheySaid:g('lnotes'),deadlineGiven:g('ldeadlinegiven')==='Yes',deadlineDate:g('ldeadline'),saidNo:g('lsaidno')==='Yes',denialReason:g('lreason'),followUpNeeded:g('lfollowneeded')==='Yes'||!!g('lfollow'),followUpDate:g('lfollow'),saveAsProof:document.getElementById('lproof').checked,relatedPathway:pathForScript(scriptType),relatedResourceId:resourceId,createdAt:now()};S.callLogs.unshift(log);if(log.followUpDate)S.followUps.push({id:uid(),title:'Follow up with '+(log.whoCalled||'contact'),dueDate:log.followUpDate,relatedPathway:log.relatedPathway,relatedCallLogId:log.id,relatedResourceId:resourceId,status:'open',createdAt:now()});if(log.saveAsProof)S.evidenceEvents.push({id:uid(),date:log.date,eventType:'call log',description:'Call log: '+(log.whoCalled||'contact')+' on '+log.date,relatedCallLogId:log.id,relatedDeadline:log.deadlineDate,relatedPathway:log.relatedPathway,safeToDisplay:true,createdAt:now()});if(log.saidNo)S.evidenceEvents.push({id:uid(),date:log.date,eventType:'denial',description:'Document the denial and ask for it in writing: '+(log.denialReason||'reason not given'),relatedCallLogId:log.id,relatedDeadline:'',relatedPathway:log.relatedPathway,safeToDisplay:true,createdAt:now()});modal='';save();render()}
function saveScript(id){if(!S.savedScripts.some(s=>s.scriptType===id))S.savedScripts.push({id:uid(),scriptType:id,title:scripts[id].title,relatedPathway:pathForScript(id),savedAt:now()});save();render()}function saveResource(resourceId){const r=sampleResources.find(x=>x.id===resourceId);if(r&&!S.savedResources.some(x=>x.resourceId===resourceId))S.savedResources.push({id:uid(),resourceId:r.id,name:r.name,category:r.category,whyMatched:r.relatedPathways.find(p=>S.plan.activePathways.includes(p))||r.category,savedAt:now(),followUpDate:''});save();render()}
function openHandoff(){modal=handoff();render()}function handoff(){const h=S.handoffSummary;return `<div class="modal"><div class="modal-card"><p class="eyebrow">Warm Handoff Summary</p><h1>Decoded Housing handoff</h1><p class="muted">Plain-language snapshot for a housing navigator, legal aid worker, or support person. This is not legal advice.</p><div class="grid two"><div class="note"><strong>Housing status</strong><br>${h.housingStatus||'Not entered'}</div><div class="note"><strong>Crisis / urgency</strong><br>${h.crisisLevel} / ${h.urgencyLevel}</div><div class="note"><strong>Urgent deadline</strong><br>${h.urgentDeadline}</div><div class="note"><strong>Household size</strong><br>${h.householdSize||'Not entered'}</div><div class="note"><strong>Children</strong><br>${h.childrenSummary}</div><div class="note"><strong>Disability / accommodation</strong><br>${h.disabilityAccommodationSummaryNeutral}</div><div class="note"><strong>Safety / private contact</strong><br>${h.safetyPrivateContactSummaryNeutral}</div><div class="note"><strong>Voucher / subsidy</strong><br>${h.voucherSubsidyStatus}</div></div><div class="section"><h2>Active pathways</h2><p>${h.activePathways.join(', ')}</p></div><div class="section"><h2>Top barriers by category</h2>${Object.entries(h.topBarriersByCategory).map(([k,v])=>`<p><strong>${k}:</strong> ${v.length?v.join(', '):'none'}</p>`).join('')}</div><div class="section"><h2>Documents missing</h2><ul class="list">${h.documentsMissing.map(d=>`<li>${d}</li>`).join('')}</ul></div><div class="section"><h2>Calls made</h2><ul class="list">${h.callsMade.length?h.callsMade.map(c=>`<li>${c}</li>`).join(''):'<li>No calls logged yet.</li>'}</ul></div><div class="section"><h2>Follow-ups</h2><ul class="list">${h.followUps.length?h.followUps.map(f=>`<li>${f.dueDate} - ${f.title}</li>`).join(''):'<li>No follow-ups saved yet.</li>'}</ul></div><div class="section"><h2>Proof saved</h2><ul class="list">${h.proofSaved.length?h.proofSaved.map(p=>`<li>${p}</li>`).join(''):'<li>No proof saved yet.</li>'}</ul></div><div class="section"><h2>Next three actions</h2><ol class="list">${h.nextThreeActions.map(a=>`<li>${a.title}: ${a.why}</li>`).join('')}</ol></div><label class="field section"><strong>Notes</strong><textarea oninput="S.handoffSummary.notes=this.value;save()">${h.notes||''}</textarea></label><div class="row handoff-actions section"><button class="btn primary" onclick="printHandoff()">Print handoff summary</button><button class="btn" onclick="modal='';render()">Close summary</button></div></div></div>`}
function printHandoff(){document.body.classList.add('print-handoff');window.print();setTimeout(()=>document.body.classList.remove('print-handoff'),200)}
function openChanged(){modal=`<div class="modal"><div class="modal-card"><h2>What changed since last time?</h2><p class="muted">Choose one update. This changes only the relevant saved fields.</p><div class="choices"><button class="choice" onclick="changed('notice')">I got a notice</button><button class="choice" onclick="changed('deadline')">I have a new deadline</button><button class="choice" onclick="changed('denied')">I was denied</button><button class="choice" onclick="openLog()">I contacted someone</button><button class="choice" onclick="changed('unit')">I found a possible unit</button><button class="choice" onclick="changed('housed')">I got housed</button><button class="choice" onclick="modal='';render()">Nothing, continue my plan</button></div></div></div>`;render()}
function changed(t){if(t==='notice'){S.currentSituation.currentHousingStatus='received a notice';S.deadlines.hasDeadline=true;S.deadlines.deadlineType='notice date'}if(t==='deadline'){S.deadlines.hasDeadline=true;S.deadlines.deadlineType='new deadline'}if(t==='denied'){S.evidenceEvents.push({id:uid(),date:now().slice(0,10),eventType:'denial',description:'Housing denial reported. Save the reason and ask for it in writing.',relatedCallLogId:'',relatedDeadline:'',relatedPathway:'Housing Search',safeToDisplay:true,createdAt:now()});S.barriers.rentalScreening.landlordReferenceNeeded=true}if(t==='unit')S.followUps.push({id:uid(),title:'Follow up on possible unit',dueDate:'',relatedPathway:'Housing Search',relatedCallLogId:'',relatedResourceId:'',status:'open',createdAt:now()});if(t==='housed'){S.currentSituation.currentHousingStatus='housed';S.plan.stayHousedNeeds=['Rent due reminder','Utility payment reminder','Benefits renewal reminder','Repair request plan','Recertification date if applicable']}modal='';save();render()}
function esc(s){return String(s).replace(/'/g,"\\'")}function render(){document.getElementById('app').innerHTML=app()}render();
</script></body></html>
