<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decoded Housing Version 0.2</title>
  <style>
    :root{--background:#FAF7F2;--surface:#FFFFFF;--surface-soft:#F4EFE8;--text:#27211F;--muted:#6F6761;--border:#E4D8CC;--primary:#8A4F3D;--primary-dark:#63372D;--secondary:#C49A5A;--accent-soft:#F2DDD3;--urgent:#B42318;--urgent-soft:#FDECEC}
    *{box-sizing:border-box} body{margin:0;background:var(--background);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button,input,select,textarea{font:inherit} button{cursor:pointer} a{color:inherit}.wrap{max-width:1120px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{font-weight:800;font-size:22px}.tag{color:var(--muted);font-size:14px}.shell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;box-shadow:0 18px 45px rgba(39,33,31,.07)}.soft{background:var(--surface-soft)}.hero{min-height:calc(100vh - 44px);display:grid;place-items:center}.hero-card{width:min(620px,100%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:34px;box-shadow:0 18px 45px rgba(39,33,31,.07)}h1,h2,h3,p{margin-top:0}h1{font-size:34px;line-height:1.08;margin-bottom:10px}h2{font-size:23px;margin-bottom:12px}h3{font-size:18px;margin-bottom:8px}.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:800}.choices{display:grid;gap:12px;margin-top:20px}.choice,.btn{min-height:48px;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:12px 14px;text-align:left;font-weight:750}.choice:hover,.choice.active{border-color:var(--primary);background:var(--accent-soft)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.dark{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}.btn.ghost{background:transparent}.btn.warn{background:var(--urgent);border-color:var(--urgent);color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.progress{height:9px;background:var(--surface-soft);border-radius:999px;overflow:hidden;margin-bottom:16px}.bar{height:100%;background:var(--primary);width:0}.mini{font-size:13px}.pill{display:inline-flex;border-radius:999px;background:var(--surface-soft);border:1px solid var(--border);padding:6px 10px;font-size:13px;font-weight:750}.urgent{background:var(--urgent-soft);border-color:#f3b9b5}.urgent .pill{background:#fff;color:var(--urgent);border-color:#f3b9b5}.lane{border-left:5px solid var(--primary);padding:14px;background:var(--surface);border-radius:8px;border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}.script,.resource,.log{border:1px solid var(--border);border-radius:8px;padding:14px;background:var(--surface)}.hidden{display:none!important}.plan-sticky{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}.field{display:grid;gap:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;background:#fff}.field textarea{min-height:100px}.note{background:var(--accent-soft);border:1px solid var(--border);border-radius:8px;padding:13px}.modal{position:fixed;inset:0;background:rgba(39,33,31,.45);display:grid;place-items:center;padding:18px;z-index:5}.modal-card{max-width:760px;width:100%;max-height:92vh;overflow:auto;background:var(--surface);border-radius:12px;padding:22px;border:1px solid var(--border)}.tele-line{font-size:30px;line-height:1.25;background:var(--primary-dark);color:#fff;border-radius:10px;min-height:210px;padding:28px;display:flex;align-items:center}.print-only{display:none}.small-list{margin:8px 0 0 18px;padding:0}.small-list li{margin:6px 0}.section{border-top:1px solid var(--border);padding-top:18px;margin-top:18px}@media(max-width:900px){.shell{grid-template-columns:1fr}.plan-sticky{position:static;max-height:none}.two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media print{.no-print,.hero,.modal{display:none!important}.print-only{display:block}.shell{display:block}.panel{box-shadow:none;border:0}.wrap{max-width:none}.plan-sticky{position:static;max-height:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  const KEY='decodedHousing.v02';
  const questions=[
    {id:'safeTonight',self:'Are you safe tonight?',nav:'Is the person you are helping safe tonight?',type:'single',options:['Yes','No - help is needed tonight','Not sure']},
    {id:'sleepTonight',self:'Do you have a safe place to sleep tonight?',nav:'Does the person have a safe place to sleep tonight?',type:'single',options:['Yes','No','Not sure']},
    {id:'contact',self:'What contact method is safe?',nav:'What contact method is safe for them?',type:'single',options:['Call or text is safe','Text only','Email only','Not safe to contact right now']},
    {id:'status',self:'What best describes your housing situation right now?',nav:'What best describes their housing situation right now?',type:'single',options:['sleeping outside','sleeping in a vehicle','emergency shelter','doubled up / couch surfing','motel / hotel','housed but unsafe','housed but unaffordable','received a notice','eviction case filed','voucher holder searching for a unit','long-term affordable housing seeker']},
    {id:'deadlineType',self:'What kind of deadline is involved?',nav:'What kind of deadline is involved?',type:'single',options:['must leave by date','notice date','court date','voucher expiration','shelter exit date','utility shutoff','application or waitlist deadline','no known deadline']},
    {id:'deadlineDate',self:'What is the deadline date, if you know it?',nav:'What is the deadline date, if known?',type:'date'},
    {id:'household',self:'Who is in the household?',nav:'Who is in the household?',type:'multi',options:['just me','partner/spouse','children','pregnant person','senior/elder','disability/medical need','pets','service animal','veteran','youth/young adult','reentry from jail/prison','fleeing violence or stalking']},
    {id:'barriers',self:'What could block housing access right now?',nav:'What could block housing access right now?',type:'multi',options:['missing ID','missing birth certificate','no Social Security card','no income proof','no phone','no mailing address','no transportation','no internet/device','prior eviction','rental debt','credit issues','criminal history','no rental history','disability accommodation needed','language access needed','childcare','move-in funds','furniture','household supplies','utilities setup','renter\'s insurance','food','phone/internet']},
    {id:'strengths',self:'What strengths can we use in the plan?',nav:'What strengths can we use in the plan?',type:'multi',options:['income or benefits','employment','voucher','past rental history','landlord reference','support person','case manager','vehicle/transportation','documents ready','veteran status','school connection','willing to consider more than one area']},
    {id:'area',self:'What city or area should this plan focus on?',nav:'What city or area should this plan focus on?',type:'text',placeholder:'Example: Bellevue, Seattle, South King County, East King County'}
  ];
  const scripts={
    shelter:{title:'211 shelter request',who:'211',ready:['Location or zip code','Household size','Children ages','Pets or service animal','Medical or disability needs'],say:['Hi, I need help finding emergency shelter tonight.','I am located in [area].','There are [number] people in my household.','Please note: [children / medical need / pet / service animal].','Can you tell me what options I should call right now?'],ask:['What shelters may have openings tonight?','Is there safe parking or a day center?','What time should I call back?'],no:'Ask for a day center, safe parking option, seasonal warming/cooling center, and a morning callback time.',after:'Log the call, save any reference number, and call again in the morning if no bed is open.'},
    ce:{title:'Coordinated Entry / RAP call',who:'Regional Access Point / Coordinated Entry',ready:['Household names and ages','Current sleeping situation','Income if any','Disability or medical needs','Prior CE history'],say:['Hi, I am calling to ask about Coordinated Entry.','The current sleeping situation is [status].','There are [number] people in the household.','Can you tell me how to schedule an assessment?'],ask:['What should I bring?','How long is the wait?','What happens after assessment?','How do I check status?'],no:'Ask for the status inquiry process and another access point or callback time.',after:'Keep CE as one track, not the only track. Add the next follow-up date.'},
    voucher:{title:'Landlord with voucher',who:'Landlord or leasing office',ready:['Voucher bedroom size','Payment standard if known','Move-in timeline','PHA contact','Income documents'],say:['Hi, I am calling about a rental you have available.','I am a Housing Choice Voucher holder.','I want to ask whether the unit could work with the voucher process.','Is this a good time to ask a few questions?'],ask:['What is the rent?','Would you work with the housing authority paperwork?','When is the unit available?','Can I schedule a showing?'],no:'Ask for the reason in writing and save the date, time, person, and exact words.',after:'Log the contact and start RFTA/RTA steps if the unit may work.'},
    rfta:{title:'RFTA/RTA paperwork',who:'PHA worker or landlord',ready:['Unit address','Landlord contact','Requested rent','Utility responsibility','Lease start date'],say:['Hi, I am ready to start tenancy approval paperwork.','Can you confirm which forms are needed and where they should be sent?','I want to make sure inspection can be scheduled quickly.'],ask:['Who fills out each section?','What is the deadline?','How do I confirm it was received?'],no:'Ask what exact item is missing and who must provide it.',after:'Save submission proof and set an inspection follow-up.'},
    arch:{title:'ARCH property manager',who:'Property manager',ready:['Bedroom size','Income estimate','Voucher info if applicable','Phone and email'],say:['Hi, I am looking for affordable housing.','I found your property through ARCH and wanted to ask a few questions.','Are you taking applications or is there a waitlist?'],ask:['What is the income limit?','Do you accept vouchers?','How do I apply?','When should I check back?'],no:'Ask when to check again and save that date. ARCH is not a central waitlist.',after:'Log the call and save the next check date.'},
    legal:{title:'Legal aid notice call',who:'Legal aid or tenant hotline',ready:['Notice type','Date on notice','Court date if any','Lease if available','Household details'],say:['Hi, I received a housing notice dated [date].','The notice says [type / I am not sure].','I need help understanding what step to take before the deadline.','Can I speak with someone today?'],ask:['What documents should I send?','Is there a response deadline?','Should I apply for rent assistance now?'],no:'Ask for another tenant hotline and the safest next step before the deadline. This is not legal advice.',after:'Photograph the notice, save the envelope, log the call, and set a reminder.'},
    rent:{title:'Rent assistance call',who:'Rental assistance program',ready:['Amount owed','Landlord contact','Notice if any','Income proof','Lease or ledger'],say:['Hi, I need help applying for rent assistance.','I owe about [amount] and my deadline is [date].','Can you tell me how to apply and what documents are required?'],ask:['Are applications open?','Can assistance be paid directly to the landlord?','Can I get confirmation after applying?'],no:'Ask where to apply next and whether emergency funds are available for households with a notice.',after:'Save confirmation and tell legal aid if a deadline exists.'},
    utility:{title:'Utility assistance call',who:'Utility assistance provider',ready:['Utility account number','Shutoff notice','Income proof','Address'],say:['Hi, I need help with utility assistance.','My utility is [electric / gas / water] and the deadline is [date].','What help is available and what documents do you need?'],ask:['Can this stop shutoff?','How long does processing take?','Can I get written confirmation?'],no:'Ask about payment plan or hold while another application is pending.',after:'Log the call and add the shutoff date to the plan.'},
    follow:{title:'Follow-up after no response',who:'Program, landlord, or agency',ready:['Last call date','Reference number','What you asked for','Deadline'],say:['Hi, I am following up on my call from [date].','I was told [what they said] and have not heard back yet.','My deadline is [date], so I need to confirm the next step today.'],ask:['Who is handling this?','What is the status?','What should I do next?','Can you send that in writing?'],no:'Ask for a supervisor, alternate contact, or written status process.',after:'Log the attempt and set another follow-up.'},
    denial:{title:'Denial documentation',who:'Property manager or program',ready:['Property name','Date of denial','Exact words used','Screenshots or email','Voucher info if relevant'],say:['Hi, I am calling about my rental inquiry or application for [property].','I was told I was denied or could not apply.','Can you send me the reason in writing?'],ask:['What screening criteria was used?','Was my voucher considered?','Who can I follow up with?'],no:'Write down that they refused to give a reason and save the call details.',after:'Save as proof and consider legal aid or fair housing support if discrimination may be involved.'},
    voicemail:{title:'Voicemail script',who:'Any housing contact',ready:['Your name','Safe callback method','Reason for calling','Deadline'],say:['Hi, my name is [name].','I am calling about [reason].','My deadline is [date].','Please call or text me back at [safe contact]. Thank you.'],ask:['Ask for a callback','Ask for the next step'],no:'If no response within the callback window, use the follow-up script.',after:'Log the voicemail date and time.'},
    writing:{title:'Ask for it in writing',who:'Landlord, PHA, program, or agency',ready:['What they told you','Email or mailing address','Deadline'],say:['Thank you for explaining that.','Can you please send that to me in writing?','I am keeping records for my housing plan.'],ask:['Can you email it?','Who should I contact if I do not receive it?'],no:'Write down the exact words, date, time, and person you spoke with.',after:'Log the call and save any text, email, or voicemail.'}
  };
  const resources=[{name:'211',fit:'Safety / Tonight',note:'Sample card. Call to confirm current options.',action:'Ask about shelter, day centers, safe parking, and morning callback times.'},{name:'Coordinated Entry / RAP',fit:'Housing pathway',note:'Sample card. CE may connect to programs but does not guarantee housing.',action:'Ask how to schedule, what to bring, and how to check status.'},{name:'Legal aid',fit:'Notice / eviction support',note:'Sample card. This app does not provide legal advice.',action:'Call if there is a notice, court date, lockout risk, or unclear denial.'},{name:'ARCH property contacts',fit:'East King County affordable housing',note:'Sample card. ARCH is not a central waitlist.',action:'Contact each property directly and set a next check date.'}];
  let state=load(); let tele=null;
  function load(){try{return Object.assign({step:'mode',q:0,answers:{},plan:false,logs:[],savedScripts:[],followups:[],lastSummary:''},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {step:'mode',q:0,answers:{},plan:false,logs:[],savedScripts:[],followups:[],lastSummary:''}}}
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function answer(id,val){state.answers[id]=val; state.plan=hasStarted(); save(); render()}
  function hasStarted(){return !!state.answers.mode}
  function val(id){return state.answers[id]|| (multiIds().includes(id)?[]:'')}
  function multiIds(){return ['household','barriers','strengths']}
  function toggle(id,opt){let a=Array.isArray(val(id))?val(id):[]; a=a.includes(opt)?a.filter(x=>x!==opt):a.concat(opt); answer(id,a)}
  function currentQuestion(){return questions[state.q]}
  function plan(){const a=state.answers; const unsafe=['No - help is needed tonight','No','Not sure'].includes(a.safeTonight)||['sleeping outside','sleeping in a vehicle'].includes(a.status); const notice=['received a notice','eviction case filed'].includes(a.status)||['notice date','court date'].includes(a.deadlineType); const voucher=a.status==='voucher holder searching for a unit'||(a.strengths||[]).includes('voucher')||a.deadlineType==='voucher expiration'; const arch=a.status==='long-term affordable housing seeker'||String(a.area||'').toLowerCase().includes('east'); const basic=(a.barriers||[]).some(b=>['food','utilities setup','phone/internet','no phone','no transportation','move-in funds','furniture','household supplies','renter\'s insurance','childcare'].includes(b)); const paths=[]; if(unsafe)paths.push('Shelter Survival Plan','Coordinated Entry Decoder'); if(voucher)paths.push('Voucher Lease-Up Tool'); if(arch)paths.push('ARCH / East King County Affordable Housing Tool'); if(notice)paths.push('Notice Triage Tool'); if((a.barriers||[]).length)paths.push('Barrier-Clearing Checklist'); if(basic)paths.push('Basic Needs Stabilization Tool'); paths.push('Stay Housed Plan starter'); const crisis=unsafe||a.status==='eviction case filed'?'Critical':notice?'High':a.status?'Moderate':'Stable-Seeking'; const first=unsafe?'Call 211 now and ask for shelter, day center, safe parking, and a morning callback time.':notice?'Call legal aid today with the notice type, date, and deadline. This is not legal advice.':voucher?'Check voucher expiration and make one landlord call using the voucher script.':'Choose the pathway with the nearest deadline and take one documented step today.'; return {crisis,urgency:crisis==='Critical'?'Immediate':crisis==='High'?'Short-term':'Planning',first,paths,unsafe,notice,voucher,arch,basic}}
  function scriptsFor(p){let s=['follow','voicemail','writing']; if(p.unsafe)s.unshift('shelter','ce'); if(p.voucher)s.unshift('voucher','rfta'); if(p.arch)s.unshift('arch'); if(p.notice)s.unshift('legal','rent'); if(p.basic)s.unshift('utility'); s.push('denial'); return [...new Set(s)]}
  function lanes(p){const a=state.answers;return[{name:'Safety / Tonight',next:p.unsafe?p.first:'Confirm tonight is safe and keep a backup contact method.',why:'A plan starts with safety before applications or resource lists.',script:p.unsafe?'shelter':null,due:p.unsafe?'Today':'As needed',proof:'211 call log, shelter names, reference numbers',fallback:'If no bed is open, ask for a day center, safe parking, and a morning callback time.'},{name:'Deadlines',next:a.deadlineType&&a.deadlineType!=='no known deadline'?`Handle ${a.deadlineType}${a.deadlineDate?' by '+a.deadlineDate:''}.`:'Add any notice, court, voucher, utility, or application date as soon as known.',why:'Missed deadlines can close options while someone is waiting for help.',script:p.notice?'legal':p.voucher?'follow':null,due:a.deadlineDate||'No date entered',proof:'Notice photos, emails, call logs, submission confirmations',fallback:'If the deadline is unclear, call the program or legal aid and ask for the date in writing.'},{name:'Housing Search',next:p.voucher?'Make one landlord voucher call and track the result.':p.arch?'Call one ARCH-listed property directly.':'Keep one active housing search step running beside crisis steps.',why:'A real housing plan runs parallel tracks.',script:p.voucher?'voucher':p.arch?'arch':'follow',due:'This week',proof:'Property name, date, answer, denial reason if any',fallback:'If there is no response, use the follow-up script and ask for it in writing.'},{name:'Documents / Barriers',next:(a.barriers||[]).length?'Start clearing: '+a.barriers[0]+'.':'Gather ID, income proof, notices, and confirmations already available.',why:'Documents and practical barriers often block otherwise possible housing steps.',script:'writing',due:'This week',proof:'Photos, receipts, confirmations, written requests',fallback:'Ask what can be submitted temporarily while the document is pending.'},{name:'Calls / Follow-ups',next:'Use scripts, log every call, and set the next follow-up date.',why:'Documentation makes the plan easier to continue and easier to hand off.',script:'follow',due:'After every call',proof:'Call log, voicemail date, staff name, reference number',fallback:'If no one responds, call again after the callback window and ask for a supervisor or alternate contact.'},{name:'Move-In / Stay Housed',next:'Save rent, utility, recertification, and repair-request reminders as they become known.',why:'Move-in is not the finish line. Stability needs reminders.',script:'utility',due:'After approval or move-in',proof:'Receipts, utility confirmations, lease dates, repair requests',fallback:'If rent, utilities, benefits, or voucher status is at risk, contact the right support the same day.'}]}
  function reality(p){let r=[]; if(p.unsafe)r.push(['A shelter list does not mean a bed is open tonight. Call to confirm.','Ask for a day center, safe parking, and a morning callback time.']); if(p.unsafe)r.push(['Coordinated Entry may help connect you to programs, but it does not guarantee housing. Keep a parallel plan active.','Run CE and direct housing search at the same time.']); if(p.arch)r.push(['ARCH is not a central waitlist. You must contact properties directly.','Call each property and save the next check date.']); if(p.voucher)r.push(['A voucher does not guarantee a landlord will complete paperwork. Track every landlord contact.','Ask for reasons in writing and keep calling additional landlords.']); if(p.notice||p.basic)r.push(['Rent assistance can close or run out of funds. Apply early and keep a backup plan.','Apply now, save proof, and call legal aid if a notice or court date exists.']); return r}
  function app(){const p=plan(); if(state.step==='mode')return modeScreen(); return `<div class="wrap"><div class="top no-print"><div><div class="brand">Decoded Housing</div><div class="tag">Version 0.2 - Get housed. Stay housed.</div></div><div class="row">${state.plan?'<button class="btn" onclick="print()">Print plan</button>':''}<button class="btn ghost" onclick="startOver()">Start over</button></div></div><div class="shell"><main>${state.step==='intake'?intakeScreen():planScreen(p)}</main><aside class="panel plan-sticky">${livePlan(p)}</aside></div></div>${tele?teleModal():''}`}
  function modeScreen(){const saved=localStorage.getItem(KEY);return `<section class="hero"><div class="hero-card"><p class="eyebrow">Decoded Housing</p><h1>Get housed. Stay housed.</h1><p class="muted">A calm housing counselor triage, planning, follow-through, and stay-housed tool.</p><h2>How are you using Decoded Housing today?</h2><div class="choices"><button class="choice" onclick="setMode('self')">I need help with my own housing</button><button class="choice" onclick="setMode('navigator')">I am helping someone else</button>${saved?'<button class="choice" onclick="continueSaved()">Continue saved plan</button>':''}</div><p class="mini muted" style="margin-top:18px">Your answers save only on this device with localStorage.</p></div></section>`}
  function intakeScreen(){const q=currentQuestion(); const label=state.answers.mode==='navigator'?q.nav:q.self; const pct=Math.round(((state.q+1)/questions.length)*100); return `<div class="panel"><div class="progress"><div class="bar" style="width:${pct}%"></div></div><p class="eyebrow">Question ${state.q+1} of ${questions.length}</p><h1>${label}</h1>${inputFor(q)}<div class="row" style="margin-top:20px"><button class="btn" onclick="prevQ()">Back</button><button class="btn primary" onclick="nextQ()">${state.q===questions.length-1?'Create My Housing Plan':'Continue'}</button></div><div class="section"><h3>What changed since last time?</h3><p class="muted mini">${changes()}</p></div></div>`}
  function inputFor(q){if(q.type==='date')return `<div class="field"><input type="date" value="${val(q.id)}" onchange="answer('${q.id}',this.value)"></div>`; if(q.type==='text')return `<div class="field"><input placeholder="${q.placeholder||''}" value="${val(q.id)}" oninput="answer('${q.id}',this.value)"></div>`; if(q.type==='multi')return `<div class="choices two">${q.options.map(o=>`<button class="choice ${val(q.id).includes(o)?'active':''}" onclick="toggle('${q.id}','${esc(o)}')">${o}</button>`).join('')}</div>`; return `<div class="choices">${q.options.map(o=>`<button class="choice ${val(q.id)===o?'active':''}" onclick="answer('${q.id}','${esc(o)}')">${o}</button>`).join('')}</div>`}
  function planScreen(p){return `<div class="panel"><p class="eyebrow">My Housing Plan</p><h1>Get housed. Stay housed.</h1><div class="row"><span class="pill">Mode: ${state.answers.mode==='navigator'?'Helping someone else':'Self-help'}</span><span class="pill">Crisis: ${p.crisis}</span><span class="pill">Urgency: ${p.urgency}</span></div><div class="section"><h2>Today&apos;s first step</h2><p>${p.first}</p></div><div class="section"><h2>Pathway lanes</h2><div class="grid">${lanes(p).map(l=>lane(l)).join('')}</div></div><div class="section"><h2>Phone Script System</h2><div class="grid two">${scriptsFor(p).map(id=>scriptCard(id)).join('')}</div></div><div class="section"><h2>Reality Notes</h2><div class="grid">${reality(p).map(n=>`<div class="note"><strong>${n[0]}</strong><br><span class="muted">Backup step: ${n[1]}</span></div>`).join('')||'<p class="muted">Reality notes appear when relevant to the plan.</p>'}</div></div><div class="section"><h2>Sample matched resource cards</h2><p class="muted">These appear only inside My Housing Plan. They are samples, not a directory. Call to confirm.</p><div class="grid two">${resources.filter(r=>p.unsafe||p.notice||p.arch||r.name==='211').map(r=>`<div class="resource"><p class="eyebrow">${r.fit}</p><h3>${r.name}</h3><p>${r.note}</p><p><strong>Next step:</strong> ${r.action}</p></div>`).join('')}</div></div><div class="section"><h2>Warm Handoff Summary</h2><div class="note">Mode: ${state.answers.mode}. Status: ${state.answers.status||'not entered'}. Area: ${state.answers.area||'not entered'}. Crisis: ${p.crisis}. First step: ${p.first} Barriers: ${(state.answers.barriers||[]).join(', ')||'none selected'}. Strengths: ${(state.answers.strengths||[]).join(', ')||'none selected'}.</div></div><div class="section"><h2>Call Log</h2><button class="btn primary" onclick="openLog()">Add call log</button><div class="grid" style="margin-top:12px">${(state.logs||[]).map(log=>`<div class="log"><strong>${log.date} - ${log.who}</strong><br>${log.notes||''}<br><span class="muted mini">Follow-up: ${log.follow||'none entered'} | Proof: ${log.proof?'yes':'no'}</span></div>`).join('')||'<p class="muted">No calls logged yet.</p>'}</div></div></div>`}
  function livePlan(p){return `<p class="eyebrow">Live My Housing Plan</p><h2>${state.plan?'Plan active':'Plan building'}</h2><p><strong>Goal:</strong> ${goal(p)}</p><p><strong>First step:</strong> ${p.first}</p><h3>This week</h3><ul class="small-list"><li>${p.first}</li><li>${state.answers.deadlineDate?'Handle deadline by '+state.answers.deadlineDate:'Add any hard deadline.'}</li><li>${(state.answers.barriers||[])[0]?'Clear barrier: '+state.answers.barriers[0]:'Gather available documents.'}</li><li>Log calls and save proof.</li></ul><h3>Active pathways</h3><div class="row">${p.paths.map(x=>`<span class="pill">${x}</span>`).join('')}</div><h3>Strengths to use</h3><p class="muted mini">${(state.answers.strengths||[]).join(', ')||'Add strengths during intake.'}</p><h3>Proof to save</h3><ul class="small-list"><li>Application confirmations</li><li>Denial notices</li><li>Call logs and voicemails</li><li>Notices, emails, screenshots</li></ul><button class="btn dark" style="width:100%;margin-top:12px" onclick="state.step='plan';state.plan=true;save();render()">Open My Housing Plan</button>`}
  function lane(l){return `<div class="lane"><h3>${l.name}</h3><p><strong>Next action:</strong> ${l.next}</p><p><strong>Why it matters:</strong> ${l.why}</p>${l.script?`<p><strong>Script:</strong> <button class="btn" onclick="openScript('${l.script}')">${scripts[l.script].title}</button></p>`:''}<p><strong>Due:</strong> ${l.due}</p><p><strong>Proof to save:</strong> ${l.proof}</p><p><strong>Fallback:</strong> ${l.fallback}</p></div>`}
  function scriptCard(id){const s=scripts[id]; return `<div class="script"><p class="eyebrow">Sample script</p><h3>${s.title}</h3><p><strong>Who to call:</strong> ${s.who}</p><p><strong>Have ready:</strong> ${s.ready.join(', ')}</p><p><strong>Exact words:</strong> ${s.say[0]}</p><p><strong>Ask:</strong> ${s.ask.join('; ')}</p><p><strong>If they say no:</strong> ${s.no}</p><p><strong>After the call:</strong> ${s.after}</p><div class="row"><button class="btn primary" onclick="openScript('${id}')">Open teleprompter</button><button class="btn" onclick="openLog('${id}')">Log call</button><button class="btn" onclick="saveScript('${id}')">Save script</button><button class="btn" onclick="addFollow('${id}')">Add follow-up</button></div></div>`}
  function teleModal(){const s=scripts[tele.id];return `<div class="modal"><div class="modal-card"><p class="eyebrow">Teleprompter Mode</p><h2>${s.title}</h2><div class="tele-line">${s.say[tele.i]}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="tele.i=Math.max(0,tele.i-1);render()">Previous line</button><button class="btn primary" onclick="tele.i=Math.min(${s.say.length-1},tele.i+1);render()">Next line</button><button class="btn" onclick="openLog('${tele.id}')">Log call</button><button class="btn" onclick="tele=null;render()">Close</button></div></div></div>`}
  function openScript(id){tele={id,i:0};render()} function saveScript(id){if(!state.savedScripts.includes(id))state.savedScripts.push(id);save();render()} function addFollow(id){const d=prompt('Follow-up date?'); if(d){state.followups.push({script:id,date:d});save();render()}} function openLog(id){tele=null; const who=id?scripts[id].who:''; const date=new Date().toISOString().slice(0,10); const html=`<div class="modal"><div class="modal-card"><h2>Log this call</h2><div class="grid two"><label class="field">Date<input id="ldate" type="date" value="${date}"></label><label class="field">Who was called?<input id="lwho" value="${who}"></label><label class="field">Phone number<input id="lphone"></label><label class="field">Did they answer?<select id="lanswer"><option>Yes</option><option>No - voicemail</option><option>No answer</option></select></label><label class="field">Who did you speak with?<input id="lperson"></label><label class="field">Did they give a deadline?<input id="ldeadline" type="date"></label><label class="field">Did they say no?<select id="lno"><option>No</option><option>Yes</option></select></label><label class="field">Follow-up date<input id="lfollow" type="date"></label></div><label class="field" style="margin-top:12px">What did they say?<textarea id="lnotes"></textarea></label><label class="field">What reason did they give?<input id="lreason"></label><label><input id="lproof" type="checkbox" checked> Save as proof?</label><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveLog()">Save call log</button><button class="btn" onclick="render()">Cancel</button></div></div></div>`; document.getElementById('app').insertAdjacentHTML('beforeend',html)}
  function saveLog(){state.logs.unshift({date:gid('ldate'),who:gid('lwho'),phone:gid('lphone'),answer:gid('lanswer'),person:gid('lperson'),deadline:gid('ldeadline'),saidNo:gid('lno'),follow:gid('lfollow'),notes:gid('lnotes'),reason:gid('lreason'),proof:document.getElementById('lproof').checked});save();render()} function gid(id){return document.getElementById(id).value}
  function setMode(m){state.answers.mode=m;state.step='intake';state.q=0;state.plan=true;save();render()} function continueSaved(){state=load(); state.step=state.step==='mode'?'intake':state.step; render()} function nextQ(){if(state.q<questions.length-1){state.q++;state.step='intake'}else{state.step='plan';state.plan=true}save();render()} function prevQ(){if(state.q>0)state.q--;else state.step='mode';save();render()} function startOver(){if(confirm('Start over and clear the saved plan on this device?')){localStorage.removeItem(KEY);state=load();render()}} function changes(){const summary=JSON.stringify(state.answers); const changed=state.lastSummary&&state.lastSummary!==summary?'Your saved answers changed. The live plan has been updated on this device.':'No previous change note yet. Your answers save as you go.'; state.lastSummary=summary; save(); return changed}
  function goal(p){if(p.unsafe)return 'Get a safer place tonight while starting parallel housing steps.'; if(p.notice)return 'Protect housing before the deadline and save proof.'; if(p.voucher)return 'Use the voucher before expiration and document every landlord contact.'; return 'Build a realistic housing plan with next steps, scripts, proof, and follow-up.'}
  function esc(s){return String(s).replace(/'/g,"\\'")} function render(){document.getElementById('app').innerHTML=app()} render();
  </script>
</body>
</html>
