class="section"><h2>Proof to Save</h2>${checks(p.proofToSave.concat(S.evidenceEvents.map(e=>e.description)).slice(0,12))}</div><details class="section"><summary>More pathway details</summary><div class="grid">${p.pathwayLanes.map(laneCard).join('')}</div></details><details class="section"><summary>More scripts</summary><div class="grid two">${p.scriptsRecommended.map(scriptCard).join('')}</div></details><details class="section"><summary>Move-in needs</summary>${checks(p.moveInNeeds)}</details><details class="section"><summary>Stay-housed plan</summary>${checks(p.stayHousedNeeds)}</details><details class="section"><summary>Warm handoff summary</summary><button class="btn dark" onclick="openHandoff()">Warm Handoff Summary</button></details><div class="section"><h2>Call Log</h2><button class="btn primary" onclick="openLog()">Add call log</button><div class="grid">${S.callLogs.map(logCard).join('')||'<p class="muted">No calls logged yet.</p>'}</div></div></div>`}function livePlan(){let p=S.plan;return `<p class="eyebrow">Live My Housing Plan</p><h2>${p.crisisLevel} / ${p.urgencyLevel}</h2><p><strong>Housing goal:</strong> ${p.housingGoal||'Answer a few questions to build the plan.'}</p><p><strong>Today's first step:</strong> ${p.todayFirstStep||'Start with safety.'}</p><h3>Next 3 actions</h3><ol class="list">${(p.nextThreeActions||[]).map(a=>`<li>${a.title}</li>`).join('')||'<li>Answer the next question.</li>'}</ol><h3>Active pathways</h3><div class="row">${(p.activePathways||[]).map(x=>`<span class="pill">${x}</span>`).join('')}</div>`}function checks(items){return `<div class="grid">${items.map(i=>`<label class="lane"><input type="checkbox"> ${i}</label>`).join('')}</div>`}function shownResources(){return(S.plan.matchedResourceIds||[]).map(id=>sampleResources.find(r=>r.id===id)).filter(Boolean).slice(0,showAllResources?99:3)}function resourceCard(r){return `<div class="resource"><p class="eyebrow">${r.category}</p><h3>${r.name}</h3><p><strong>Why it matched:</strong> ${r.relatedPathways.find(p=>S.plan.activePathways.includes(p))||r.category}</p><p><strong>What it helps with:</strong> ${r.whatItHelpsWith}</p><p><strong>What to ask for:</strong> ${r.whatToAskFor}</p><p><strong>Contact:</strong> ${r.phone||'call to confirm'} ${r.website?` | ${r.website}`:''}</p><p><strong>Documents ready:</strong> ${r.documentsNeeded.join(', ')}</p><p class="muted">Last checked: ${r.lastChecked}. Source: ${r.sourceLabel}. Verification: ${r.verificationStatus}. ${r.staleWarning}</p><p><strong>Call to confirm before relying on this.</strong></p><button class="btn" onclick="saveResource('${r.id}')">Save to plan</button> <button class="btn" onclick="openLog('${r.scriptType}','${r.id}')">Log call</button></div>`}function laneCard(l){return `<div class="lane"><h3>${l.name}</h3><p><strong>First:</strong> ${l.next}</p><p><strong>Why:</strong> ${l.why}</p><p><strong>Backup:</strong> ${l.fallback}</p><p><strong>Proof:</strong> ${l.proof}</p>${reality(l.name)}</div>`}function reality(name){let c=compute(),t='';if(name==='Safety / Tonight'&&c.unsafe)t='A shelter list does not mean a bed is open tonight. Backup: ask about day centers, safe parking, and a morning callback time.';if(name==='Housing Search'&&c.voucher)t='A voucher does not guarantee a landlord will complete paperwork. Backup: track every landlord contact and keep calling.';if(name==='Housing Search'&&c.arch)t='ARCH is not a central waitlist. Backup: contact properties directly and set check-back dates.';if(name==='Deadlines'&&c.notice)t='Rent assistance can close or run out of funds. Backup: apply early and call legal aid if a notice or court date exists.';return t?`<div class="note"><strong>Reality note:</strong> ${t}</div>`:''}function scriptCard(id){let s=scripts[id];return `<div class="script"><h3>${s.title}</h3><p><strong>Who to call:</strong> ${s.who}</p><p><strong>What to have ready:</strong> ${s.ready.join(', ')}</p><p><strong>Exact words:</strong> ${s.say[0]}</p><p><strong>What to ask:</strong> ${s.ask.join('; ')}</p><p><strong>If they say no:</strong> ${s.no}</p><p><strong>After the call:</strong> ${s.after}</p><button class="btn primary" onclick="openScript('${id}')">Open teleprompter</button> <button class="btn" onclick="openLog('${id}')">Log call</button> <button class="btn" onclick="saveScript('${id}')">Save script</button></div>`}function logCard(l){return `<div class="log"><strong>${l.date} - ${l.whoCalled}</strong><br>${l.whatTheySaid||''}<br><span class="muted">Answered: ${l.didAnswer}. Follow-up: ${l.followUpDate||'none'}. Proof: ${l.saveAsProof?'yes':'no'}</span>${l.saidNo?'<p class="urgent lane"><strong>Next:</strong> document the denial and ask for it in writing.</p>':''}</div>`}
function answer(v){cq().save(v);persist();render()}function toggle(o){let q=cq(),a=val(q).slice();a=a.includes(o)?a.filter(x=>x!==o):a.concat(o);q.save(a);persist();render()}function setBarrier(g,k){S.barriers[g][k]=!S.barriers[g][k];if(g==='moveInBasicNeeds'||k==='transportationBarrier'||k==='childcare')S.incomeBenefits.basicNeedsTriggered=true;persist();render()}function nextQ(){if(qi()<activeQs().length-1)S.profile.currentStep=qi()+1;else S.profile.intakeComplete=true;persist();render()}function prevQ(){if(qi()>0)S.profile.currentStep=qi()-1;persist();render()}function answerFirst(v){questions[0].save(v);S.profile.currentStep=1;persist();render()}function continueSaved(){S=load();openChanged()}function startOver(){if(confirm('Start over and clear the saved plan on this device?')){localStorage.removeItem(KEY);S=blank();modal='';tele=null;render()}}
function openScript(id){tele={id,i:0};render()}function teleModal(){let s=scripts[tele.id];return `<div class="modal"><div class="modal-card"><p class="eyebrow">Teleprompter Mode</p><h2>${s.title}</h2><div class="tele-line">${s.say[tele.i]}</div><div class="row section"><button class="btn" onclick="tele.i=Math.max(0,tele.i-1);render()">Previous line</button><button class="btn primary" onclick="tele.i=Math.min(${s.say.length-1},tele.i+1);render()">Next line</button><button class="btn" onclick="const id=tele.id;tele=null;openLog(id)">Close and log call</button><button class="btn" onclick="tele=null;render()">Close</button></div></div></div>`}function openLog(scriptType='',resourceId=''){let who=scriptType&&scripts[scriptType]?scripts[scriptType].who:'';modal=`<div class="modal"><div class="modal-card"><h2>Log this call</h2><div class="grid two"><label class="field">Date<input id="ldate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field">Who was called?<input id="lwho" value="${who}"></label><label class="field">Phone number<input id="lphone"></label><label class="field">Did they answer?<select id="lanswered"><option>Yes</option><option>No - voicemail</option><option>No answer</option></select></label><label class="field">Who did you speak with?<input id="lperson"></label><label class="field">Did they give a deadline?<select id="ldeadlinegiven"><option>No</option><option>Yes</option></select></label><label class="field">Deadline date<input id="ldeadline" type="date"></label><label class="field">Did they say no?<select id="lsaidno"><option>No</option><option>Yes</option></select></label><label class="field">Follow-up needed?<select id="lfollowneeded"><option>No</option><option>Yes</option></select></label><label class="field">Follow-up date<input id="lfollow" type="date"></label></div><label class="field section">What did they say?<textarea id="lnotes"></textarea></label><label class="field">What reason did they give?<input id="lreason"></label><label><input id="lproof" type="checkbox" checked> Save as proof?</label><div class="row section"><button class="btn primary" onclick="saveLog('${scriptType}','${resourceId}')">Save call log</button><button class="btn" onclick="modal='';render()">Cancel</button></div></div></div>`;render()}function pathFor(id){return{shelter211:'Shelter Survival Plan',ce:'Coordinated Entry Preparation',voucher:'Voucher Lease-Up',rfta:'Voucher Lease-Up',arch:'ARCH / Affordable Housing',legalNotice:'Notice Triage',rent:'Notice Triage',utility:'Basic Needs Stabilization',accommodation:'Disability / Accommodation'}[id]||''}function g(id){return document.getElementById(id).value}function saveLog(scriptType='',resourceId=''){let log={id:uid(),date:g('ldate'),whoCalled:g('lwho'),phoneNumber:g('lphone'),didAnswer:g('lanswered'),spokeWith:g('lperson'),whatTheySaid:g('lnotes'),deadlineGiven:g('ldeadlinegiven')==='Yes',deadlineDate:g('ldeadline'),saidNo:g('lsaidno')==='Yes',denialReason:g('lreason'),followUpNeeded:g('lfollowneeded')==='Yes'||!!g('lfollow'),followUpDate:g('lfollow'),saveAsProof:document.getElementById('lproof').checked,relatedPathway:pathFor(scriptType),relatedResourceId:resourceId,createdAt:now()};S.callLogs.unshift(log);if(log.followUpDate)S.followUps.push({id:uid(),title:'Follow up with '+(log.whoCalled||'contact'),dueDate:log.followUpDate,relatedPathway:log.relatedPathway,relatedCallLogId:log.id,relatedResourceId:resourceId,status:'open',createdAt:now()});if(log.saveAsProof)S.evidenceEvents.push({id:uid(),date:log.date,eventType:'call log',description:'Call log: '+(log.whoCalled||'contact')+' on '+log.date,relatedCallLogId:log.id,relatedDeadline:log.deadlineDate,relatedPathway:log.relatedPathway,safeToDisplay:true,createdAt:now()});if(log.saidNo)S.evidenceEvents.push({id:uid(),date:log.date,eventType:'denial',description:'Denial documented: '+(log.denialReason||'reason not given'),relatedCallLogId:log.id,relatedDeadline:'',relatedPathway:log.relatedPathway,safeToDisplay:true,createdAt:now()});modal='';persist();render()}function saveScript(id){if(!S.savedScripts.some(s=>s.scriptType===id))S.savedScripts.push({id:uid(),scriptType:id,title:scripts[id].title,relatedPathway:pathFor(id),savedAt:now()});persist();render()}function saveResource(resourceId){let r=sampleResources.find(x=>x.id===resourceId);if(r&&!S.savedResources.some(x=>x.resourceId===resourceId))S.savedResources.push({id:uid(),resourceId:r.id,name:r.name,category:r.category,whyMatched:r.relatedPathways.find(p=>S.plan.activePathways.includes(p))||r.category,savedAt:now(),followUpDate:''});persist();render()}
function openHandoff(){modal=handoff();render()}function handoff(){let h=S.handoffSummary;return `<div class="modal"><div class="modal-card"><p class="eyebrow">Warm Handoff Summary</p><h1>Decoded Housing handoff</h1><p class="muted">Plain-language snapshot for a housing navigator, legal aid worker, or support person. This is not legal advice.</p><div class="grid two"><div class="note"><strong>Housing status</strong><br>${h.housingStatus||'Not entered'}</div><div class="note"><strong>Crisis / urgency</strong><br>${h.crisisLevel} / ${h.urgencyLevel}</div><div class="note"><strong>Urgent deadline</strong><br>${h.urgentDeadline}</div><div class="note"><strong>Household size</strong><br>${h.householdSize||'Not entered'}</div><div class="note"><strong>Children</strong><br>${h.childrenSummary}</div><div class="note"><strong>Disability / accommodation</strong><br>${h.disabilityAccommodationSummaryNeutral}</div><div class="note"><strong>Safety / private contact</strong><br>${h.safetyPrivateContactSummaryNeutral}</div><div class="note"><strong>Voucher / subsidy</strong><br>${h.voucherSubsidyStatus}</div></div><div class="section"><h2>Income / benefits</h2><p>${h.incomeBenefitsStatus||'Not entered'}</p></div><div class="section"><h2>Active pathways</h2><p>${h.activePathways.join(', ')}</p></div><div class="section"><h2>Top barriers by category</h2>${Object.entries(h.topBarriersByCategory).map(([k,v])=>`<p><strong>${k}:</strong> ${v.length?v.join(', '):'none'}</p>`).join('')}</div><div class="section"><h2>Documents missing</h2><ul class="list">${h.documentsMissing.map(d=>`<li>${d}</li>`).join('')}</ul></div><div class="section"><h2>Calls made</h2><ul class="list">${h.callsMade.length?h.callsMade.map(c=>`<li>${c}</li>`).join(''):'<li>No calls logged yet.</li>'}</ul></div><div class="section"><h2>Follow-ups</h2><ul class="list">${h.followUps.length?h.followUps.map(f=>`<li>${f.dueDate||'No date'} - ${f.title}</li>`).join(''):'<li>No follow-ups saved yet.</li>'}</ul></div><div class="section"><h2>Proof saved</h2><ul class="list">${h.proofSaved.length?h.proofSaved.map(p=>`<li>${p}</li>`).join(''):'<li>No proof saved yet.</li>'}</ul></div><div class="section"><h2>Next three actions</h2><ol class="list">${h.nextThreeActions.map(a=>`<li>${a.title}: ${a.why}</li>`).join('')}</ol></div><label class="field section"><strong>Notes</strong><textarea oninput="S.handoffSummary.notes=this.value;persist()">${h.notes||''}</textarea></label><div class="row handoff-actions section"><button class="btn primary" onclick="printHandoff()">Print handoff summary</button><button class="btn" onclick="modal='';render()">Close summary</button></div></div></div>`}function printHandoff(){document.body.classList.add('print-handoff');window.print();setTimeout(()=>document.body.classList.remove('print-handoff'),200)}function openChanged(){modal=`<div class="modal"><div class="modal-card"><h2>What changed since last time?</h2><p class="muted">Choose one update. This changes only the relevant saved fields.</p><div class="choices"><button class="choice" onclick="changed('notice')">I got a notice</button><button class="choice" onclick="changed('deadline')">I have a new deadline</button><button class="choice" onclick="changed('denied')">I was denied</button><button class="choice" onclick="openLog()">I contacted someone</button><button class="choice" onclick="changed('unit')">I found a possible unit</button><button class="choice" onclick="changed('housed')">I got housed</button><button class="choice" onclick="modal='';S.profile.intakeComplete=true;persist();render()">Nothing, continue my plan</button></div></div></div>`;render()}function changed(t){if(t==='notice'){S.currentSituation.currentHousingStatus='received a notice';S.deadlines.hasDeadline=true;S.deadlines.deadlineType='notice date'}if(t==='deadline'){S.deadlines.hasDeadline=true;S.deadlines.deadlineType='new deadline'}if(t==='denied'){S.evidenceEvents.push({id:uid(),date:now().slice(0,10),eventType:'denial',description:'Housing denial reported. Save the reason and ask for it in writing.',relatedCallLogId:'',relatedDeadline:'',relatedPathway:'Housing Search',safeToDisplay:true,createdAt:now()});S.barriers.rentalScreening.landlordReferenceNeeded=true}if(t==='unit')S.followUps.push({id:uid(),title:'Follow up on possible unit',dueDate:'',relatedPathway:'Housing Search',relatedCallLogId:'',relatedResourceId:'',status:'open',createdAt:now()});if(t==='housed'){S.currentSituation.currentHousingStatus='housed';S.plan.stayHousedNeeds=['Rent due reminder','Utility payment reminder','Benefits renewal reminder','Repair request plan','Recertification date if applicable']}S.profile.intakeComplete=true;modal='';persist();render()}function esc(s){return String(s).replace(/'/g,"\\'")}function render(){document.getElementById('app').innerHTML=app()}render();
</script></body></html>
