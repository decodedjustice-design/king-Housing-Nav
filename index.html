function app(){save();if(!S.profile.intakeComplete&&S.profile.currentStep===0&&!S.safety.safeTonight)return firstScreen();return `<div class="wrap"><div class="top no-print"><div><div class="brand">Decoded Housing</div><div class="tag">Self-Help Housing Counselor MVP</div></div><div class="row"><button class="btn" onclick="print()">Print plan</button><button class="btn" onclick="openChanged()">What changed since last time?</button><button class="btn ghost" onclick="startOver()">Start over</button></div></div><div class="layout"><main>${!S.profile.intakeComplete?questionCard():fullPlan()}</main><aside class="plan">${livePlan()}</aside></div></div>${modal}${tele?teleModal():''}`}
function firstScreen(){const saved=localStorage.getItem(KEY);return `<section class="hero"><div class="hero-card"><p class="eyebrow">Decoded Housing</p><h1>Get housed. Stay housed.</h1><p class="muted">We'll start with safety, then build your housing plan one step at a time.</p><p class="note">Your answers are saved on this device so your plan can continue later.</p><h2>Are you safe tonight?</h2><div class="choices">${questions[0].options.map(o=>`<button class="choice" onclick="answerFirst('${esc(o)}')">${o}</button>`).join('')}${saved?'<button class="choice" onclick="continueSaved()">Continue my housing plan</button><button class="choice" onclick="startOver()">Start over</button>':''}</div></div></section>`}
function questionCard(){const list=activeQuestionList();const q=currentQuestion();const pct=Math.round(((qIndex()+1)/list.length)*100);return `<div class="card no-print"><div class="progress"><div class="bar" style="width:${pct}%"></div></div><p class="eyebrow">Question ${qIndex()+1} of ${list.length}</p><h1>${q.q}</h1>${q.hint?`<p class="muted">${q.hint}</p>`:''}${input(q)}${q.micro?`<p class="note small" style="margin-top:14px">${q.micro}</p>`:''}<div class="row section"><button class="btn" onclick="prevQ()">Back</button><button class="btn primary" onclick="nextQ()">${qIndex()===list.length-1?'Open My Housing Plan':'Continue'}</button></div><p class="small muted">Your answers are saved on this device so your plan can continue later.</p></div>`}
function input(q){const val=getValue(q);if(q.type==='date')return `<label class="field"><input type="date" value="${val||''}" onchange="setQuestionValue(currentQuestion(),this.value)"></label>`;if(q.type==='number')return `<label class="field"><input type="number" min="0" value="${val||''}" oninput="setQuestionValue(currentQuestion(),this.value)"></label>`;if(q.type==='text')return `<label class="field"><input placeholder="${q.placeholder||''}" value="${val||''}" oninput="setQuestionValue(currentQuestion(),this.value)"></label>`;if(q.type==='multi')return `<div class="choices two">${q.options.map(o=>`<button class="choice ${val.includes(o)?'active':''}" onclick="toggle(currentQuestion(),'${esc(o)}')">${o}</button>`).join('')}</div>`;return `<div class="choices">${q.options.map(o=>`<button class="choice ${val===o?'active':''}" onclick="setQuestionValue(currentQuestion(),'${esc(o)}')">${o}</button>`).join('')}</div>`}
function livePlan(){const p=S.plan;return `<p class="eyebrow">Live My Housing Plan</p><h2>${p.crisisLevel} / ${p.urgencyLevel}</h2><p><strong>Housing goal:</strong> ${p.housingGoal||'Answer a few questions to build the plan.'}</p><p><strong>Today's first step:</strong> ${p.todayFirstStep||'Start with safety.'}</p><h3>Next 3 actions</h3><ol class="list">${(p.nextThreeActions||[]).map(a=>`<li>${a.title}</li>`).join('')||'<li>Answer the next question.</li>'}</ol><h3>Active pathways</h3><div class="row">${(p.activePathways||[]).map(x=>`<span class="pill">${x}</span>`).join('')}</div><h3>Follow-up dates</h3><ul class="list">${S.followUps.map(f=>`<li>${f.dueDate} - ${f.title}</li>`).join('')||'<li>Add follow-ups after calls.</li>'}</ul></div>`}
function fullPlan(){const p=S.plan;return `<div class="card section"><p class="eyebrow">My Housing Plan</p><h1>Get housed. Stay housed.</h1><div class="note"><h2>Top Priority</h2><p><strong>${p.crisisLevel} / ${p.urgencyLevel}</strong></p><p>${p.todayFirstStep}</p><p class="muted">${p.whyThisComesFirst}</p>${S.deadlines.hasDeadline?`<p><strong>Deadline:</strong> ${S.deadlines.deadlineType} ${S.deadlines.deadlineDate||''}</p>`:''}</div><div class="section"><h2>Next 3 Actions</h2><div class="grid">${p.nextThreeActions.map(actionCard).join('')}</div></div><div class="section"><h2>Active Pathways</h2><div class="row">${p.activePathways.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div><div class="section"><h2>Calls to Make</h2><div class="grid">${p.callsToMake.map(callCard).join('')||'<p class="muted">No calls matched yet.</p>'}</div></div><div class="section"><h2>Documents to Gather</h2>${checks(p.documentsToGather.slice(0,8))}</div><div class="section"><h2>Matched Support Options</h2><p class="muted">Sample resources appear only inside My Housing Plan. Call to confirm before relying on this.</p><div class="grid">${resourcesToShow().map(resourceCard).join('')||'<p class="muted">Answer more questions to match support options.</p>'}</div>${p.matchedResourceIds.length>3&&!showAllResources?'<button class="btn no-print" onclick="showAllResources=true;render()">Show more matched options</button>':''}</div><div class="section"><h2>Follow-Up Dates</h2><ul class="list">${S.followUps.map(f=>`<li>${f.dueDate} - ${f.title} (${f.status})</li>`).join('')||'<li>No follow-up dates saved yet.</li>'}</ul></div><div class="section"><h2>Proof to Save</h2>${checks(p.proofToSave.concat(S.evidenceEvents.filter(e=>e.safeToDisplay!==false).map(e=>e.description)).slice(0,12))}</div><details class="section"><summary>More pathway details</summary><div class="grid" style="margin-top:12px">${p.pathwayLanes.map(lane).join('')}</div></details><details class="section"><summary>More scripts</summary><div class="grid two" style="margin-top:12px">${p.scriptsRecommended.map(scriptCard).join('')}</div></details><details class="section"><summary>Move-in needs</summary>${checks(p.moveInNeeds)}</details><details class="section"><summary>Stay-housed plan</summary>${checks(p.stayHousedNeeds)}</details><details class="section"><summary>Warm handoff summary</summary><p class="muted">Printable summary for a housing navigator, legal aid worker, or support person.</p><button class="btn dark no-print" onclick="openHandoff()">Warm Handoff Summary</button></details><div class="section"><h2>Call Log</h2><button class="btn primary no-print" onclick="openLog()">Add call log</button><div class="grid" style="margin-top:12px">${S.callLogs.map(logCard).join('')||'<p class="muted">No calls logged yet.</p>'}</div></div></div>`}
function actionCard(a){return `<div class="action"><h3>${a.title}</h3><p>${a.why}</p><div class="row no-print">${a.scriptType?`<button class="btn" onclick="openScript('${a.scriptType}')">Script</button>`:''}${a.followUpDate?`<span class="pill">Follow-up: ${a.followUpDate}</span>`:''}</div></div>`}
function callCard(c){return `<div class="lane"><h3>${c.who}</h3><p>${c.why}</p><div class="row no-print"><button class="btn" onclick="openScript('${c.scriptType}')">Script</button><button class="btn" onclick="openLog('${c.scriptType}')">Log call</button></div></div>`}
function lane(l){return `<div class="lane"><h3>${l.name}</h3><p><strong>Next:</strong> ${l.next}</p><p><strong>Why:</strong> ${l.why}</p>${l.scriptType?`<p><button class="btn no-print" onclick="openScript('${l.scriptType}')">${scripts[l.scriptType].title}</button></p>`:''}<p><strong>Due:</strong> ${l.due}</p><p><strong>Proof:</strong> ${l.proof}</p><p><strong>Fallback:</strong> ${l.fallback}</p>${realityFor(l.name)}</div>`}
function realityFor(name){const c=compute();let n=[];if(name==='Safety / Tonight'&&c.unsafe)n=['A shelter list does not mean a bed is open tonight. Call to confirm.','Backup: ask about day centers, safe parking, and a morning callback time.'];if(name==='Housing Search'&&c.voucher)n=['A voucher does not guarantee a landlord will complete paperwork. Track every landlord contact.','Backup: keep calling additional landlords and ask for denials in writing.'];if(name==='Housing Search'&&c.arch)n=['ARCH is not a central waitlist. You must contact properties directly.','Backup: set a next check date for each property.'];if(name==='Deadlines'&&c.notice)n=['Rent assistance can close or run out of funds. Apply early and keep a backup plan.','Backup: call legal aid if a notice or court date exists.'];return n.length?`<div class="note"><strong>Reality note:</strong> ${n[0]}<br><span class="muted">${n[1]}</span></div>`:''}
function resourcesToShow(){const ids=S.plan.matchedResourceIds||[];const items=ids.map(id=>sampleResources.find(r=>r.id===id)).filter(Boolean);return showAllResources?items:items.slice(0,3)}
function resourceCard(r){const c=compute();const why=r.relatedPathways.find(x=>c.paths.includes(x))||r.relatedBarriers.find(b=>selectedBarriers().includes(b))||r.category;return `<div class="resource"><p class="eyebrow">${r.category}</p><h3>${r.name}</h3><p><strong>Why it matched:</strong> ${why}</p><p><strong>What it helps with:</strong> ${r.whatItHelpsWith}</p><p><strong>What to ask for:</strong> ${r.whatToAskFor}</p><p><strong>Contact:</strong> ${r.phone||'call to confirm'} ${r.website?` | ${r.website}`:''}</p><p><strong>Documents ready:</strong> ${r.documentsNeeded.join(', ')}</p><p class="small muted">Last checked: ${r.lastChecked}. Source: ${r.sourceLabel}. Verification: ${r.verificationStatus}. ${r.staleWarning}</p><p><strong>Call to confirm before relying on this.</strong></p><div class="row no-print"><button class="btn" onclick="saveResource('${r.id}')">Save to plan</button><button class="btn" onclick="openLog('${r.scriptType}','${r.id}')">Log call</button></div></div>`}
function scriptCard(id){const s=scripts[id];return `<div class="script"><p class="eyebrow">Phone script</p><h3>${s.title}</h3><p><strong>Who to call:</strong> ${s.who}</p><p><strong>What to have ready:</strong> ${s.ready.join(', ')}</p><p><strong>Exact words:</strong> ${s.say[0]}</p><p><strong>What to ask:</strong> ${s.ask.join('; ')}</p><p><strong>If they say no:</strong> ${s.no}</p><p><strong>After the call:</strong> ${s.after}</p><div class="row no-print"><button class="btn primary" onclick="openScript('${id}')">Open teleprompter</button><button class="btn" onclick="openLog('${id}')">Log call</button><button class="btn" onclick="saveScript('${id}')">Save script</button></div></div>`}
function checks(items){return `<div class="grid">${items.map(i=>`<label class="lane"><input type="checkbox"> ${i}</label>`).join('')}</div>`}
function logCard(l){return `<div class="log"><strong>${l.date} - ${l.whoCalled}</strong><br>${l.whatTheySaid||''}<br><span class="muted small">Answered: ${l.didAnswer}. Follow-up: ${l.followUpDate||'none'}. Proof: ${l.saveAsProof?'yes':'no'}</span>${l.saidNo?'<p class="urgent lane"><strong>Next step:</strong> document the denial and ask for it in writing.</p>':''}</div>`}
function openScript(id){tele={id,i:0};render()}
function teleModal(){const s=scripts[tele.id];return `<div class="modal"><div class="modal-card"><p class="eyebrow">Teleprompter Mode</p><h2>${s.title}</h2><div class="tele-line">${s.say[tele.i]}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="tele.i=Math.max(0,tele.i-1);render()">Previous line</button><button class="btn primary" onclick="tele.i=Math.min(${s.say.length-1},tele.i+1);render()">Next line</button><button class="btn" onclick="const id=tele.id;tele=null;openLog(id)">Close and log call</button><button class="btn" onclick="tele=null;render()">Close</button></div></div></div>`}
function openLog(scriptType='',resourceId=''){const who=scriptType&&scripts[scriptType]?scripts[scriptType].who:'';modal=`<div class="modal"><div class="modal-card"><h2>Log this call</h2><div class="grid two"><label class="field">Date<input id="ldate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field">Who was called?<input id="lwho" value="${who}"></label><label class="field">Phone number<input id="lphone"></label><label class="field">Did they answer?<select id="lanswered"><option>Yes</option><option>No - voicemail</option><option>No answer</option></select></label><label class="field">Who did you speak with?<input id="lperson"></label><label class="field">Did they give a deadline?<select id="ldeadlinegiven"><option>No</option><option>Yes</option></select></label><label class="field">Deadline date<input id="ldeadline" type="date"></label><label class="field">Did they say no?<select id="lsaidno"><option>No</option><option>Yes</option></select></label><label class="field">Follow-up needed?<select id="lfollowneeded"><option>No</option><option>Yes</option></select></label><label class="field">Follow-up date<input id="lfollow" type="date"></label></div><label class="field" style="margin-top:12px">What did they say?<textarea id="lnotes"></textarea></label><label class="field">What reason did they give?<input id="lreason"></label><label><input id="lproof" type="checkbox" checked> Save as proof?</label><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveLog('${scriptType}','${resourceId}')">Save call log</button><button class="btn" onclick="modal='';render()">Cancel</button></div></div></div>`;render()}
function saveLog(scriptType='',resourceId=''){const log={id:uid(),date:g('ldate'),whoCalled:g('lwho'),phoneNumber:g('lphone'),didAnswer:g('lanswered'),spokeWith:g('lperson'),whatTheySaid:g('lnotes'),deadlineGiven:g('ldeadlinegiven')==='Yes',deadlineDate:g('ldeadline'),saidNo:g('lsaidno')==='Yes',denialReason:g('lreason'),followUpNeeded:g('lfollowneeded')==='Yes'||!!g('lfollow'),followUpDate:g('lfollow'),saveAsProof:document.getElementById('lproof').checked,relatedPathway:relatedPathwayForScript(scriptType),relatedResourceId:resourceId,createdAt:now()};S.callLogs.unshift(log);if(log.followUpDate)S.followUps.push({id:uid(),title:'Follow up with '+(log.whoCalled||'contact'),dueDate:log.followUpDate,relatedPathway:log.relatedPathway,relatedCallLogId:log.id,relatedResourceId:resourceId,status:'open',createdAt:now()});if(log.saveAsProof)S.evidenceEvents.push({id:uid(),date:log.date,eventType:'call log',description:'Call log: '+(log.whoCalled||'contact')+' on '+log.date,relatedCallLogId:log.id,relatedDeadline:log.deadlineDate,relatedPathway:log.relatedPathway,safeToDisplay:true,createdAt:now()});if(log.saidNo)S.evidenceEvents.push({id:uid(),date:log.date,eventType:'denial',description:'Document the denial and ask for it in writing: '+(log.denialReason||'reason not given'),relatedCallLogId:log.id,relatedDeadline:'',relatedPathway:log.relatedPathway,safeToDisplay:true,createdAt:now()});modal='';save();render()}
function relatedPathwayForScript(id){const map={shelter211:'Shelter Survival Plan',ce:'Shelter Survival Plan',voucher:'Voucher Lease-Up',rfta:'Voucher Lease-Up',arch:'ARCH / East King County Affordable Housing',legalNotice:'Notice Triage',rent:'Notice Triage',utility:'Basic Needs Stabilization',accommodation:'Disability / Accommodation'};return map[id]||''}
function saveScript(id){if(!S.savedScripts.some(s=>s.scriptType===id))S.savedScripts.push({id:uid(),scriptType:id,title:scripts[id].title,relatedPathway:relatedPathwayForScript(id),savedAt:now()});save();render()}
function saveResource(resourceId){const r=sampleResources.find(x=>x.id===resourceId);if(r&&!S.savedResources.some(x=>x.resourceId===resourceId))S.savedResources.push({id:uid(),resourceId:r.id,name:r.name,category:r.category,whyMatched:r.relatedPathways.find(p=>S.plan.activePathways.includes(p))||r.category,savedAt:now(),followUpDate:''});if(r)S.evidenceEvents.push({id:uid(),date:new Date().toISOString().slice(0,10),eventType:'saved resource',description:'Saved resource: '+r.name,relatedCallLogId:'',relatedDeadline:'',relatedPathway:'',safeToDisplay:true,createdAt:now()});save();render()}
function openHandoff(){modal=handoffHtml();render()}
function handoffHtml(){const h=S.handoffSummary;return `<div class="modal"><div class="modal-card" id="handoffSummary"><p class="eyebrow">Warm Handoff Summary</p><h1>Decoded Housing handoff</h1><p class="muted">Plain-language snapshot for a housing navigator, legal aid worker, or support person. This is not legal advice.</p><div class="grid two"><div class="note"><strong>Housing status</strong><br>${h.housingStatus||'Not entered'}</div><div class="note"><strong>Crisis / urgency</strong><br>${h.crisisLevel} / ${h.urgencyLevel}</div><div class="note"><strong>Urgent deadline</strong><br>${h.urgentDeadline}</div><div class="note"><strong>Household size</strong><br>${h.householdSize||'Not entered'}</div><div class="note"><strong>Children</strong><br>${h.childrenSummary}</div><div class="note"><strong>Disability / accommodation</strong><br>${h.disabilityAccommodationSummaryNeutral}</div><div class="note"><strong>Safety / private contact</strong><br>${h.safetyPrivateContactSummaryNeutral}</div><div class="note"><strong>Voucher / subsidy</strong><br>${h.voucherSubsidyStatus}</div></div><div class="section"><h2>Active pathways</h2><p>${h.activePathways.join(', ')}</p></div><div class="section"><h2>Top barriers by category</h2>${Object.entries(h.topBarriersByCategory).map(([k,v])=>`<p><strong>${k}:</strong> ${v.length?v.join(', '):'none'}</p>`).join('')}</div><div class="section"><h2>Documents missing</h2><ul class="list">${h.documentsMissing.map(d=>`<li>${d}</li>`).join('')}</ul></div><div class="section"><h2>Calls made</h2><ul class="list">${h.callsMade.length?h.callsMade.map(c=>`<li>${c}</li>`).join(''):'<li>No calls logged yet.</li>'}</ul></div><div class="section"><h2>Follow-ups</h2><ul class="list">${h.followUps.length?h.followUps.map(f=>`<li>${f.dueDate} - ${f.title}</li>`).join(''):'<li>No follow-ups saved yet.</li>'}</ul></div><div class="section"><h2>Proof saved</h2><ul class="list">${h.proofSaved.length?h.proofSaved.map(p=>`<li>${p}</li>`).join(''):'<li>No proof saved yet.</li>'}</ul></div><div class="section"><h2>Next three actions</h2><ol class="list">${h.nextThreeActions.map(a=>`<li>${a.title}: ${a.why}</li>`).join('')}</ol></div><label class="field section"><strong>Notes</strong><textarea id="handoffNotes" oninput="S.handoffSummary.notes=this.value;save()">${h.notes||''}</textarea></label><div class="row handoff-actions section"><button class="btn primary" onclick="printHandoff()">Print handoff summary</button><button class="btn" onclick="modal='';render()">Close summary</button></div></div></div>`}
function printHandoff(){document.body.classList.add('print-handoff');window.print();setTimeout(()=>document.body.classList.remove('print-handoff'),200)}
function openChanged(){modal=`<div class="modal"><div class="modal-card"><h2>What changed since last time?</h2><p class="muted">Choose one update. This changes only the relevant saved fields.</p><div class="choices"><button class="choice" onclick="changed('notice')">I got a notice</button><button class="choice" onclick="changed('deadline')">I have a new deadline</button><button class="choice" onclick="changed('denied')">I was denied</button><button class="choice" onclick="openLog()">I contacted someone</button><button class="choice" onclick="changed('unit')">I found a possible unit</button><button class="choice" onclick="changed('housed')">I got housed</button><button class="choice" onclick="modal='';render()">Nothing, continue my plan</button></div></div></div>`;render()}
function changed(type){if(type==='notice'){S.currentSituation.currentHousingStatus='received a notice';S.deadlines.hasDeadline=true;S.deadlines.deadlineType='notice date'}if(type==='deadline'){S.deadlines.hasDeadline=true;S.deadlines.deadlineKnown=false;S.deadlines.deadlineType='new deadline'}if(type==='denied'){S.evidenceEvents.push({id:uid(),date:now().slice(0,10),eventType:'denial',description:'Housing denial reported. Save the reason and ask for it in writing.',relatedCallLogId:'',relatedDeadline:'',relatedPathway:'Housing Search',safeToDisplay:true,createdAt:now()});S.barriers.rentalScreening.landlordReferenceNeeded=true}if(type==='unit'){S.followUps.push({id:uid(),title:'Follow up on possible unit',dueDate:'',relatedPathway:'Housing Search',relatedCallLogId:'',relatedResourceId:'',status:'open',createdAt:now()})}if(type==='housed'){S.currentSituation.currentHousingStatus='housed';S.plan.stayHousedNeeds=['Rent due reminder','Utility payment reminder','Benefits renewal reminder','Repair request plan','Recertification date if applicable']}modal='';save();render()}
function answerFirst(v){questions[0].save(v);S.profile.currentStep=1;save();render()}function nextQ(){const list=activeQuestionList();if(qIndex()<list.length-1)S.profile.currentStep=qIndex()+1;else S.profile.intakeComplete=true;save();render()}function prevQ(){if(qIndex()>0)S.profile.currentStep=qIndex()-1;save();render()}function continueSaved(){S=load();if(S.profile.intakeComplete){save();render()}else{S.profile.currentStep=Math.max(S.profile.currentStep||0,1);save();render()}}function startOver(){if(confirm('Start over and clear the saved plan on this device?')){localStorage.removeItem(KEY);S=emptyState();modal='';tele=null;render()}}function g(id){return document.getElementById(id).value}function esc(s){return String(s).replace(/'/g,"\\'")}function render(){document.getElementById('app').innerHTML=app()}render();
</script></body></html>
